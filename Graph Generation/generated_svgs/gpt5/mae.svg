<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .main-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #222; }
      .label-text { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .block { stroke-width: 2; }
      .sub { stroke: #999; fill: #ffffff; stroke-width: 1.5; }
      .arrow { stroke: #555; stroke-width: 2; fill: none; }
      .pill { fill: #f3e8ff; stroke: #b48cff; stroke-width: 1; rx: 10; ry: 10; }
      .note { fill: #fffbe6; stroke: #ffcc80; stroke-width: 1; rx: 8; ry: 8; }
      .merge { fill: #fff; stroke: #777; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Input Module -->
  <g id="input-module">
    <rect x="60" y="150" width="200" height="200" rx="10" ry="10" fill="#e6f3ff" stroke="#5a9bd5" class="block"/>
    <text x="160" y="140" class="main-text" text-anchor="middle">input image</text>
    <!-- Input grid -->
    <g stroke="#b9d7f1" stroke-width="1">
      <!-- vertical lines -->
      <line x1="85" y1="150" x2="85" y2="350"/>
      <line x1="110" y1="150" x2="110" y2="350"/>
      <line x1="135" y1="150" x2="135" y2="350"/>
      <line x1="160" y1="150" x2="160" y2="350"/>
      <line x1="185" y1="150" x2="185" y2="350"/>
      <line x1="210" y1="150" x2="210" y2="350"/>
      <line x1="235" y1="150" x2="235" y2="350"/>
      <!-- horizontal lines -->
      <line x1="60" y1="175" x2="260" y2="175"/>
      <line x1="60" y1="200" x2="260" y2="200"/>
      <line x1="60" y1="225" x2="260" y2="225"/>
      <line x1="60" y1="250" x2="260" y2="250"/>
      <line x1="60" y1="275" x2="260" y2="275"/>
      <line x1="60" y1="300" x2="260" y2="300"/>
      <line x1="60" y1="325" x2="260" y2="325"/>
    </g>
  </g>

  <!-- Encoder Block -->
  <g id="encoder-block">
    <rect x="320" y="90" width="200" height="320" rx="12" ry="12" fill="#fff3e0" stroke="#ff9800" class="block"/>
    <text x="420" y="110" class="main-text" text-anchor="middle">encoder</text>

    <!-- Submodules inside encoder -->
    <rect x="340" y="210" width="160" height="40" rx="6" ry="6" class="sub"/>
    <text x="420" y="233" class="label-text" text-anchor="middle">patch embed</text>
    <text x="420" y="247" class="label-text" text-anchor="middle">conv or linear</text>

    <rect x="340" y="260" width="160" height="40" rx="6" ry="6" class="sub"/>
    <text x="420" y="282" class="label-text" text-anchor="middle">mask sampler</text>
    <text x="420" y="298" class="label-text" text-anchor="middle">mask ratio 75 percent</text>

    <rect x="340" y="310" width="160" height="70" rx="6" ry="6" class="sub"/>
    <text x="420" y="330" class="label-text" text-anchor="middle">encoder layers</text>
    <text x="420" y="345" class="label-text" text-anchor="middle">visible tokens only</text>
    <rect x="350" y="353" width="140" height="6" fill="#cfe2f3" stroke="none"/>
    <rect x="350" y="365" width="140" height="6" fill="#cfe2f3" stroke="none"/>
    <rect x="350" y="377" width="140" height="6" fill="#cfe2f3" stroke="none"/>

    <!-- Optional masking and degradation mechanisms feeding mask sampler -->
    <!-- Merge node for options -->
    <circle cx="332" cy="280" r="5" class="merge"/>

    <!-- Uniform masking option -->
    <rect x="270" y="260" width="56" height="18" class="pill"/>
    <text x="298" y="273" class="label-text" text-anchor="middle">uniform</text>
    <path d="M 326 269 L 327 269 L 327 275 L 327 275" class="arrow"/>
    <line x1="326" y1="269" x2="328" y2="275" class="arrow" marker-end="url(#arrowhead)"/>

    <!-- Local masking option -->
    <rect x="270" y="290" width="56" height="18" class="pill"/>
    <text x="298" y="303" class="label-text" text-anchor="middle">local</text>
    <line x1="326" y1="299" x2="327" y2="286" class="arrow" marker-end="url(#arrowhead)"/>

    <!-- Zoom in degradation -->
    <rect x="270" y="235" width="56" height="20" class="note"/>
    <text x="298" y="249" class="label-text" text-anchor="middle">zoom in</text>
    <path d="M 326 245 L 330 276" class="arrow" marker-end="url(#arrowhead)"/>

    <!-- Frequency masking -->
    <rect x="270" y="315" width="56" height="20" class="note"/>
    <text x="298" y="329" class="label-text" text-anchor="middle">frequency</text>
    <path d="M 326 325 L 330 284" class="arrow" marker-end="url(#arrowhead)"/>

    <!-- Merge to mask sampler left edge -->
    <line x1="337" y1="280" x2="340" y2="280" class="arrow" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Decoder Block -->
  <g id="decoder-block">
    <rect x="580" y="90" width="220" height="320" rx="12" ry="12" fill="#eef0ff" stroke="#3f51b5" class="block"/>
    <text x="690" y="110" class="main-text" text-anchor="middle">decoder</text>

    <!-- Mask token source and mix tokens merge -->
    <rect x="650" y="220" width="80" height="20" class="pill"/>
    <text x="690" y="234" class="label-text" text-anchor="middle">mask tokens</text>

    <!-- MixMIM additional image source -->
    <g id="mixmim-source">
      <rect x="440" y="380" width="120" height="100" rx="8" ry="8" fill="#f0f7ff" stroke="#8ab6e6" stroke-width="1.5"/>
      <text x="500" y="372" class="label-text" text-anchor="middle">image b</text>
      <g stroke="#d1e5fb" stroke-width="1">
        <line x1="460" y1="380" x2="460" y2="480"/>
        <line x1="480" y1="380" x2="480" y2="480"/>
        <line x1="500" y1="380" x2="500" y2="480"/>
        <line x1="520" y1="380" x2="520" y2="480"/>
        <line x1="540" y1="380" x2="540" y2="480"/>
        <line x1="440" y1="400" x2="560" y2="400"/>
        <line x1="440" y1="420" x2="560" y2="420"/>
        <line x1="440" y1="440" x2="560" y2="440"/>
        <line x1="440" y1="460" x2="560" y2="460"/>
      </g>
    </g>

    <!-- Merge node above add mask tokens for mask or mix tokens -->
    <circle cx="690" cy="242" r="6" class="merge"/>
    <!-- mask tokens to merge -->
    <line x1="690" y1="240" x2="690" y2="236" class="arrow" marker-end="url(#arrowhead)"/>
    <!-- mix tokens to merge -->
    <path d="M 560 430 L 560 242 L 684 242" class="arrow" marker-end="url(#arrowhead)"/>

    <!-- Submodules inside decoder -->
    <rect x="600" y="250" width="180" height="40" rx="6" ry="6" class="sub"/>
    <text x="690" y="270" class="label-text" text-anchor="middle">add mask tokens</text>
    <!-- merge to add mask tokens -->
    <line x1="690" y1="248" x2="690" y2="250" class="arrow" marker-end="url(#arrowhead)"/>

    <rect x="600" y="300" width="180" height="40" rx="6" ry="6" class="sub"/>
    <text x="690" y="320" class="label-text" text-anchor="middle">add pos embed</text>
    <text x="690" y="336" class="label-text" text-anchor="middle">positional embeddings</text>

    <rect x="600" y="350" width="180" height="40" rx="6" ry="6" class="sub"/>
    <text x="690" y="370" class="label-text" text-anchor="middle">decoder layers</text>
    <rect x="612" y="368" width="156" height="6" fill="#dcd9ff" stroke="none"/>

    <rect x="600" y="400" width="180" height="40" rx="6" ry="6" class="sub"/>
    <text x="690" y="420" class="label-text" text-anchor="middle">reconstruction head</text>
  </g>

  <!-- Target Module -->
  <g id="target-module">
    <rect x="860" y="150" width="200" height="200" rx="10" ry="10" fill="#e8ffe8" stroke="#4caf50" class="block"/>
    <text x="960" y="140" class="main-text" text-anchor="middle">target reconstruction</text>
    <!-- Target grid -->
    <g stroke="#b7e1b7" stroke-width="1">
      <!-- vertical lines -->
      <line x1="885" y1="150" x2="885" y2="350"/>
      <line x1="910" y1="150" x2="910" y2="350"/>
      <line x1="935" y1="150" x2="935" y2="350"/>
      <line x1="960" y1="150" x2="960" y2="350"/>
      <line x1="985" y1="150" x2="985" y2="350"/>
      <line x1="1010" y1="150" x2="1010" y2="350"/>
      <line x1="1035" y1="150" x2="1035" y2="350"/>
      <!-- horizontal lines -->
      <line x1="860" y1="175" x2="1060" y2="175"/>
      <line x1="860" y1="200" x2="1060" y2="200"/>
      <line x1="860" y1="225" x2="1060" y2="225"/>
      <line x1="860" y1="250" x2="1060" y2="250"/>
      <line x1="860" y1="275" x2="1060" y2="275"/>
      <line x1="860" y1="300" x2="1060" y2="300"/>
      <line x1="860" y1="325" x2="1060" y2="325"/>
    </g>
  </g>

  <!-- Loss Node -->
  <g id="loss-node">
    <circle cx="1120" cy="250" r="22" fill="#fff7f7" stroke="#e57373" stroke-width="2"/>
    <text x="1120" y="247" class="label-text" text-anchor="middle">loss</text>
    <text x="1120" y="263" class="label-text" text-anchor="middle">L2</text>
    <text x="1092" y="292" class="label-text">masked pixel loss</text>
  </g>

  <!-- Flow Arrows -->
  <!-- Input to encoder -->
  <line x1="260" y1="250" x2="320" y2="250" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Encoder internal arrows -->
  <line x1="420" y1="250" x2="420" y2="260" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="300" x2="420" y2="310" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Encoder to decoder first step add mask tokens -->
  <line x1="500" y1="270" x2="600" y2="270" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Decoder internal arrows -->
  <line x1="690" y1="290" x2="690" y2="300" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="340" x2="690" y2="350" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="390" x2="690" y2="400" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- From reconstruction head to target using orthogonal connector below target -->
  <path d="M 780 420 L 820 420 L 820 460 L 960 460 L 960 350" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- From target to loss node -->
  <line x1="1060" y1="250" x2="1098" y2="250" class="arrow" marker-end="url(#arrowhead)"/>
</svg>