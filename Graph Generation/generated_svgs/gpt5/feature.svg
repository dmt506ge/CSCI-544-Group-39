<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="360" fill="#ffffff"/>

  <!-- Left section inputs -->
  <!-- Top input stack -->
  <rect x="24" y="44" width="120" height="70" fill="#e8f6ff" stroke="#6faed6" stroke-width="1"/>
  <rect x="32" y="52" width="120" height="70" fill="#e8f6ff" stroke="#6faed6" stroke-width="1"/>
  <rect x="40" y="60" width="120" height="70" fill="#d1ecff" stroke="#6faed6" stroke-width="2" rx="6"/>
  <text x="100" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#1a365d">Labelled</text>
  <text x="100" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#1a365d">source domain</text>

  <!-- Bottom input stack -->
  <rect x="24" y="204" width="120" height="70" fill="#e8f6ff" stroke="#6faed6" stroke-width="1"/>
  <rect x="32" y="212" width="120" height="70" fill="#e8f6ff" stroke="#6faed6" stroke-width="1"/>
  <rect x="40" y="220" width="120" height="70" fill="#d1ecff" stroke="#6faed6" stroke-width="2" rx="6"/>
  <text x="100" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#1a365d">Unlabelled</text>
  <text x="100" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#1a365d">target domain</text>

  <!-- CNN modules -->
  <!-- Top CNN -->
  <rect x="200" y="70" width="120" height="50" fill="#ffe3b3" stroke="#d6a85c" stroke-width="2" rx="6"/>
  <text x="260" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#5a3b00">CNN</text>

  <!-- Bottom CNN -->
  <rect x="200" y="230" width="120" height="50" fill="#ffe3b3" stroke="#d6a85c" stroke-width="2" rx="6"/>
  <text x="260" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#5a3b00">CNN</text>

  <!-- Shared weights bracket with concise inline tag -->
  <line x1="190" y1="70" x2="190" y2="280" stroke="#888888" stroke-width="2"/>
  <line x1="186" y1="70" x2="194" y2="70" stroke="#888888" stroke-width="2"/>
  <line x1="186" y1="280" x2="194" y2="280" stroke="#888888" stroke-width="2"/>
  <text x="176" y="178" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#555555">shared</text>

  <!-- Arrows from inputs to CNNs -->
  <line x1="160" y1="95" x2="200" y2="95" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-head)"/>
  <line x1="160" y1="255" x2="200" y2="255" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- Feature maps -->
  <!-- Top feature map -->
  <rect x="360" y="70" width="140" height="50" fill="#d4f5d0" stroke="#66aa66" stroke-width="2" rx="6"/>
  <text x="430" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#22543d">Feature map</text>

  <!-- Bottom feature map -->
  <rect x="360" y="230" width="140" height="50" fill="#d4f5d0" stroke="#66aa66" stroke-width="2" rx="6"/>
  <text x="430" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#22543d">Feature map</text>

  <!-- Bidirectional dashed interaction between feature maps with precise edge anchoring -->
  <line x1="430" y1="120" x2="430" y2="230" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow-head)" marker-end="url(#arrow-head)"/>
  <text x="440" y="178" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11px" fill="#2b6cb0">L align</text>

  <!-- Right hierarchical section -->
  <!-- ID FC -->
  <rect x="560" y="80" width="140" height="50" fill="#e5d4ff" stroke="#8a6fd1" stroke-width="2" rx="6"/>
  <text x="630" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#3f2d7d">ID FC</text>

  <!-- Attr FC -->
  <rect x="560" y="170" width="140" height="50" fill="#e5d4ff" stroke="#8a6fd1" stroke-width="2" rx="6"/>
  <text x="630" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#3f2d7d">Attr FC</text>

  <!-- Orthogonal arrows from feature maps to hierarchical blocks with concise supervision tags -->
  <!-- Source feature to ID FC -->
  <polyline points="500,95 540,95 540,105 560,105" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-head)"/>
  <text x="542" y="90" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10px" fill="#444444">source only</text>

  <!-- Source feature to Attr FC -->
  <polyline points="500,95 540,95 540,195 560,195" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-head)"/>
  <text x="542" y="188" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10px" fill="#444444">source and target</text>

  <!-- Target feature to Attr FC -->
  <polyline points="500,255 540,255 540,195 560,195" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- Vertical connection ID FC to Attr FC -->
  <line x1="630" y1="130" x2="630" y2="170" stroke="#8a6fd1" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- Horizontal L attr arrow originating from the ID FC and Attr FC connection, routed orthogonally -->
  <line x1="630" y1="150" x2="760" y2="150" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-head)"/>
  <text x="670" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#cc0000">L attr</text>

  <!-- Right aligned groups -->
  <!-- Person IDs group label -->
  <text x="900" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#1a202c">Person IDs</text>

  <!-- Person IDs boxes aligned to accept horizontal connectors from ID FC -->
  <rect x="900" y="80" width="18" height="12" fill="#f2f2f2" stroke="#777777" stroke-width="1"/>
  <rect x="900" y="96" width="18" height="12" fill="#f2f2f2" stroke="#777777" stroke-width="1"/>
  <rect x="900" y="112" width="18" height="12" fill="#f2f2f2" stroke="#777777" stroke-width="1"/>
  <rect x="900" y="120" width="18" height="12" fill="#f2f2f2" stroke="#777777" stroke-width="1"/>

  <!-- Attr IDs group label -->
  <text x="900" y="190" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#1a202c">Attr IDs</text>

  <!-- Attr IDs boxes aligned to accept horizontal connectors from Attr FC -->
  <rect x="900" y="178" width="18" height="12" fill="#f2f2f2" stroke="#777777" stroke-width="1"/>
  <rect x="900" y="190" width="18" height="12" fill="#f2f2f2" stroke="#777777" stroke-width="1"/>
  <rect x="900" y="202" width="18" height="12" fill="#f2f2f2" stroke="#777777" stroke-width="1"/>
  <rect x="900" y="214" width="18" height="12" fill="#f2f2f2" stroke="#777777" stroke-width="1"/>

  <!-- Dense matrix links from ID FC to Person IDs with precise anchoring -->
  <line x1="700" y1="86" x2="900" y2="86" stroke="#8a6fd1" stroke-width="1.2" marker-end="url(#arrow-head)"/>
  <line x1="700" y1="102" x2="900" y2="102" stroke="#8a6fd1" stroke-width="1.2" marker-end="url(#arrow-head)"/>
  <line x1="700" y1="118" x2="900" y2="118" stroke="#8a6fd1" stroke-width="1.2" marker-end="url(#arrow-head)"/>
  <line x1="700" y1="126" x2="900" y2="126" stroke="#8a6fd1" stroke-width="1.2" marker-end="url(#arrow-head)"/>
  <text x="740" y="76" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10px" fill="#3f2d7d">L ID</text>

  <!-- Dense matrix links from Attr FC to Attr IDs with precise anchoring -->
  <line x1="700" y1="184" x2="900" y2="184" stroke="#8a6fd1" stroke-width="1.2" marker-end="url(#arrow-head)"/>
  <line x1="700" y1="196" x2="900" y2="196" stroke="#8a6fd1" stroke-width="1.2" marker-end="url(#arrow-head)"/>
  <line x1="700" y1="208" x2="900" y2="208" stroke="#8a6fd1" stroke-width="1.2" marker-end="url(#arrow-head)"/>
  <line x1="700" y1="220" x2="900" y2="220" stroke="#8a6fd1" stroke-width="1.2" marker-end="url(#arrow-head)"/>
  <text x="740" y="172" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10px" fill="#3f2d7d">L attr cls</text>
</svg>