<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#000" />
    </marker>
  </defs>

  <!-- Top Section: "Point cloud adapter" -->
  <!-- Left Block: Initial Data Processing -->
  <rect x="100" y="50" width="100" height="50" fill="teal" />
  <text x="110" y="80" font-family="Arial" font-size="12px" fill="#fff">Initial Data</text>

  <rect x="210" y="50" width="100" height="50" fill="yellow" />
  <text x="220" y="80" font-family="Arial" font-size="12px" fill="#000">Current Data</text>

  <rect x="320" y="50" width="100" height="50" fill="gray" />
  <text x="330" y="80" font-family="Arial" font-size="12px" fill="#fff">Previous Data</text>

  <!-- Center Block: Transformation Processes -->
  <path d="M370,100 L370,150" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="380" y="130" font-family="Arial" font-size="12px" fill="#000">Sparsify Process</text>

  <rect x="320" y="150" width="100" height="50" fill="red" />
  <text x="335" y="180" font-family="Arial" font-size="12px" fill="#fff">Aggregated Data</text>

  <path d="M370,200 L370,250" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="380" y="230" font-family="Arial" font-size="12px" fill="#000">Aggregation</text>

  <!-- Right Block: Data Conversion -->
  <circle cx="370" cy="300" r="25" fill="red" />
  <text x="355" y="305" font-family="Arial" font-size="12px" fill="#fff">Output Data</text>

  <!-- Arrows: Top Section Interactions -->
  <path d="M100,75 Q50,150 100,225" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="20" y="150" font-family="Arial" font-size="12px" fill="#000">Query Process</text>

  <path d="M370,325 L370,375" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="380" y="350" font-family="Arial" font-size="12px" fill="#000">Add to Memory</text>

  <!-- Bottom Section: "Point cloud memory" -->
  <!-- Left Block: Initial Transformation -->
  <rect x="100" y="375" width="100" height="50" fill="teal" />
  <text x="110" y="405" font-family="Arial" font-size="12px" fill="#fff">Voxelize Process</text>

  <!-- Center Block: Previous Memory -->
  <rect x="210" y="375" width="50" height="150" fill="gray" />
  <text x="215" y="460" font-family="Arial" font-size="12px" fill="#fff" writing-mode="tb">Previous Memory</text>

  <!-- Right Block: Updated Memory -->
  <rect x="270" y="375" width="100" height="50" fill="teal" />
  <rect x="270" y="425" width="100" height="50" fill="yellow" />
  <rect x="270" y="475" width="100" height="50" fill="gray" />
  <text x="280" y="405" font-family="Arial" font-size="12px" fill="#fff">Updated Memory Structure</text>

  <!-- Arrows: Bottom Section Interactions -->
  <path d="M200,400 L210,400" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="170" y="395" font-family="Arial" font-size="12px" fill="#000">Merge Operation</text>

  <path d="M260,400 L270,400" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="240" y="395" font-family="Arial" font-size="12px" fill="#000">Update Memory</text>

  <!-- Looping Arrow: Memory Update to Top Section -->
  <path d="M370,475 Q420,375 370,275" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="430" y="375" font-family="Arial" font-size="12px" fill="#000">Memory Loop</text>
</svg>