<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>

  <!-- Input Module -->
  <rect x="50" y="125" width="100" height="100" fill="#add8e6" stroke="#000" stroke-width="2" />
  <text x="100" y="115" font-size="14" text-anchor="middle" fill="#000">Input</text>
  <text x="100" y="170" font-size="12" text-anchor="middle" fill="#000">Image Grid</text>
  
  <!-- Additional Annotation -->
  <text x="100" y="240" font-size="10" text-anchor="middle" fill="#000">Initial input is masked into a grid for processing</text>

  <!-- Encoder Module -->
  <rect x="200" y="85" width="100" height="180" fill="#98fb98" stroke="#000" stroke-width="2" />
  <text x="250" y="75" font-size="14" text-anchor="middle" fill="#000">Encoder</text>
  <text x="250" y="125" font-size="12" text-anchor="middle" fill="#000">Masked Input</text>
  <text x="250" y="145" font-size="12" text-anchor="middle" fill="#000">Self-Attention</text>
  <text x="250" y="165" font-size="12" text-anchor="middle" fill="#000">Semantic Regions</text>
  
  <!-- Annotation for Encoder -->
  <text x="250" y="280" font-size="10" text-anchor="middle" fill="#000">Uses self-attention to identify semantic regions</text>

  <!-- Decoder Module -->
  <rect x="350" y="85" width="100" height="180" fill="#ffb6c1" stroke="#000" stroke-width="2" />
  <text x="400" y="75" font-size="14" text-anchor="middle" fill="#000">Decoder</text>
  <text x="400" y="125" font-size="12" text-anchor="middle" fill="#000">Reconstruction</text>
  <text x="400" y="145" font-size="12" text-anchor="middle" fill="#000">Holistic View</text>
  <text x="400" y="165" font-size="12" text-anchor="middle" fill="#000">Concept Learning</text>
  
  <!-- Annotation for Decoder -->
  <text x="400" y="280" font-size="10" text-anchor="middle" fill="#000">Reconstructs a holistic view from semantic regions</text>

  <!-- Target Module -->
  <rect x="500" y="125" width="100" height="100" fill="#ffcccb" stroke="#000" stroke-width="2" />
  <text x="550" y="115" font-size="14" text-anchor="middle" fill="#000">Target</text>
  <text x="550" y="170" font-size="12" text-anchor="middle" fill="#000">Image Grid</text>
  
  <!-- Additional Annotation -->
  <text x="550" y="240" font-size="10" text-anchor="middle" fill="#000">Final output after reconstruction and learning</text>

  <!-- Arrows -->
  <line x1="150" y1="175" x2="200" y2="175" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="300" y1="175" x2="350" y2="175" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="450" y1="175" x2="500" y2="175" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
</svg>