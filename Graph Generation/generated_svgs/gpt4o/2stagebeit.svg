<svg width="1200" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000" />
    </marker>
  </defs>

  <!-- Stage 1 -->
  <g id="stage1">
    <!-- Original Image -->
    <rect x="50" y="50" width="100" height="50" fill="#FFCCCB" />
    <text x="55" y="80" font-family="Arial" font-size="14">Original Image</text>

    <!-- Tokenizer -->
    <rect x="200" y="50" width="100" height="50" fill="#ADD8E6" />
    <text x="215" y="80" font-family="Arial" font-size="14">Tokenizer</text>

    <!-- Numerical Token Representation -->
    <rect x="350" y="50" width="200" height="50" fill="#E6E6FA" />
    <text x="370" y="80" font-family="Arial" font-size="14">Token Representation</text>

    <!-- Decoder -->
    <rect x="600" y="50" width="100" height="50" fill="#ADD8E6" />
    <text x="630" y="80" font-family="Arial" font-size="14">Decoder</text>

    <!-- Reconstructed Image -->
    <rect x="750" y="50" width="150" height="50" fill="#FFCCCB" />
    <text x="760" y="80" font-family="Arial" font-size="14">Reconstructed Image</text>

    <!-- Arrows for Stage 1 -->
    <line x1="150" y1="75" x2="200" y2="75" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="300" y1="75" x2="350" y2="75" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="550" y1="75" x2="600" y2="75" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="700" y1="75" x2="750" y2="75" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <!-- Stage 2 -->
  <g id="stage2" transform="translate(0, 300)">
    <!-- Image Input -->
    <rect x="50" y="50" width="100" height="50" fill="#FFCCCB" />
    <text x="65" y="80" font-family="Arial" font-size="14">Image Input</text>

    <!-- Tokenizer with Lock Icon -->
    <rect x="200" y="50" width="120" height="50" fill="#ADD8E6" />
    <text x="205" y="80" font-family="Arial" font-size="14">Tokenizer</text>
    <text x="325" y="80" font-family="Arial" font-size="14">Lock</text>

    <!-- Token Output with Samples -->
    <rect x="350" y="50" width="200" height="50" fill="#E6E6FA" />
    <text x="370" y="80" font-family="Arial" font-size="14">Token Output</text>

    <!-- Masked Image Modeling Head -->
    <rect x="50" y="150" width="500" height="50" fill="#D3D3D3" />
    <text x="200" y="180" font-family="Arial" font-size="14">Masked Image Modeling Head</text>

    <!-- BEiT Encoder -->
    <rect x="50" y="250" width="500" height="100" fill="#87CEFA" />
    <text x="250" y="280" font-family="Arial" font-size="14">BEiT Encoder</text>
    <text x="250" y="300" font-family="Arial" font-size="12">- Self-attention maps</text>
    <text x="250" y="320" font-family="Arial" font-size="12">- Semantic region distinction</text>

    <!-- Patch Embedding and Position Embedding -->
    <rect x="50" y="400" width="100" height="50" fill="#FFE4B5" />
    <text x="55" y="430" font-family="Arial" font-size="12">Patch Embedding</text>
    <rect x="200" y="400" width="200" height="50" fill="#FFE4B5" />
    <text x="225" y="430" font-family="Arial" font-size="12">Position Embedding</text>

    <!-- Image Patches -->
    <rect x="50" y="500" width="80" height="80" fill="#FFDEAD" />
    <text x="65" y="540" font-family="Arial" font-size="12">Image Patches</text>

    <!-- Arrows for Stage 2 -->
    <line x1="150" y1="75" x2="200" y2="75" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="320" y1="75" x2="350" y2="75" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="150" y1="100" x2="150" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="300" y1="100" x2="300" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="300" y1="200" x2="300" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="300" y1="350" x2="300" y2="400" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="150" y1="450" x2="200" y2="450" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <!-- Connection between Stage 1 and Stage 2 -->
  <line x1="875" y1="75" x2="50" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="550" y="325" font-family="Arial" font-size="16" fill="#000">Connection: Stage 1 to Stage 2</text>
</svg>