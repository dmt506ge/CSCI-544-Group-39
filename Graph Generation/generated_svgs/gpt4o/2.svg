<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">

  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>

  <!-- Video Frames -->
  <rect x="50" y="20" width="100" height="50" fill="#FFCCCB" />
  <text x="65" y="50" font-family="Arial" font-size="14">Video Frame t=0</text>

  <rect x="250" y="20" width="100" height="50" fill="#FFCCCB" />
  <text x="265" y="50" font-family="Arial" font-size="14">Video Frame t=1</text>

  <rect x="450" y="20" width="100" height="50" fill="#FFCCCB" />
  <text x="465" y="50" font-family="Arial" font-size="14">Video Frame t=N</text>

  <!-- Deep Recurrent Network (RSHN) -->
  <rect x="50" y="100" width="100" height="50" fill="#FFD700" />
  <text x="55" y="130" font-family="Arial" font-size="14">RSHN t=0</text>

  <rect x="250" y="100" width="100" height="50" fill="#FFD700" />
  <text x="255" y="130" font-family="Arial" font-size="14">RSHN t=1</text>

  <rect x="450" y="100" width="100" height="50" fill="#FFD700" />
  <text x="455" y="130" font-family="Arial" font-size="14">RSHN t=N</text>

  <!-- Pixel-wise Embedding -->
  <rect x="50" y="180" width="100" height="50" fill="#ADD8E6" />
  <text x="55" y="210" font-family="Arial" font-size="14">Embedding t=0</text>

  <rect x="250" y="180" width="100" height="50" fill="#ADD8E6" />
  <text x="255" y="210" font-family="Arial" font-size="14">Embedding t=1</text>

  <rect x="450" y="180" width="100" height="50" fill="#ADD8E6" />
  <text x="455" y="210" font-family="Arial" font-size="14">Embedding t=N</text>

  <!-- Mean-shift Clustering -->
  <rect x="50" y="260" width="100" height="50" fill="#90EE90" />
  <text x="55" y="290" font-family="Arial" font-size="14">Faster Mean-shift t=0</text>

  <rect x="250" y="260" width="100" height="50" fill="#90EE90" />
  <text x="255" y="290" font-family="Arial" font-size="14">Faster Mean-shift t=1</text>

  <rect x="450" y="260" width="100" height="50" fill="#90EE90" />
  <text x="455" y="290" font-family="Arial" font-size="14">Faster Mean-shift t=N</text>

  <!-- Output -->
  <rect x="50" y="340" width="100" height="50" fill="#FF69B4" />
  <text x="65" y="370" font-family="Arial" font-size="14">Output t=0</text>

  <rect x="250" y="340" width="100" height="50" fill="#FF69B4" />
  <text x="265" y="370" font-family="Arial" font-size="14">Output t=1</text>

  <rect x="450" y="340" width="100" height="50" fill="#FF69B4" />
  <text x="465" y="370" font-family="Arial" font-size="14">Output t=N</text>

  <!-- Flow Arrows -->
  <!-- From Video Frames to RSHN -->
  <line x1="100" y1="70" x2="100" y2="100" stroke="#008000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="110" y="85" font-family="Arial" font-size="10" fill="#008000">Input Flow</text>
  <line x1="300" y1="70" x2="300" y2="100" stroke="#008000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="310" y="85" font-family="Arial" font-size="10" fill="#008000">Input Flow</text>
  <line x1="500" y1="70" x2="500" y2="100" stroke="#008000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="510" y="85" font-family="Arial" font-size="10" fill="#008000">Input Flow</text>

  <!-- From RSHN to Pixel-wise Embedding -->
  <line x1="100" y1="150" x2="100" y2="180" stroke="#FF4500" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="110" y="165" font-family="Arial" font-size="10" fill="#FF4500">Embedding</text>
  <line x1="300" y1="150" x2="300" y2="180" stroke="#FF4500" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="310" y="165" font-family="Arial" font-size="10" fill="#FF4500">Embedding</text>
  <line x1="500" y1="150" x2="500" y2="180" stroke="#FF4500" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="510" y="165" font-family="Arial" font-size="10" fill="#FF4500">Embedding</text>

  <!-- From Pixel-wise Embedding to Clustering -->
  <line x1="100" y1="230" x2="100" y2="260" stroke="#FF4500" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="110" y="245" font-family="Arial" font-size="10" fill="#FF4500">Clustering</text>
  <line x1="300" y1="230" x2="300" y2="260" stroke="#FF4500" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="310" y="245" font-family="Arial" font-size="10" fill="#FF4500">Clustering</text>
  <line x1="500" y1="230" x2="500" y2="260" stroke="#FF4500" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="510" y="245" font-family="Arial" font-size="10" fill="#FF4500">Clustering</text>

  <!-- From Clustering to Output -->
  <line x1="100" y1="310" x2="100" y2="340" stroke="#FF4500" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="110" y="325" font-family="Arial" font-size="10" fill="#FF4500">Output</text>
  <line x1="300" y1="310" x2="300" y2="340" stroke="#FF4500" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="310" y="325" font-family="Arial" font-size="10" fill="#FF4500">Output</text>
  <line x1="500" y1="310" x2="500" y2="340" stroke="#FF4500" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="510" y="325" font-family="Arial" font-size="10" fill="#FF4500">Output</text>

  <!-- Horizontal continuity arrows between RSHN modules -->
  <line x1="150" y1="125" x2="250" y2="125" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="350" y1="125" x2="450" y2="125" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

</svg>