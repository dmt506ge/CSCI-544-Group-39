<svg width="1400" height="1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#D00" />
    </marker>
  </defs>
  
  <!-- Stage 1 Label -->
  <text x="50" y="40" font-size="18" font-weight="bold" fill="#333">Stage 1: Tokenization and Reconstruction (Creates Discrete Token Vocabulary)</text>
  
  <!-- Stage 1 Components -->
  <!-- Original Image -->
  <rect x="50" y="60" width="120" height="100" fill="#E8F4F8" stroke="#333" stroke-width="2"/>
  <text x="110" y="105" font-size="14" text-anchor="middle" fill="#333">Original</text>
  <text x="110" y="125" font-size="14" text-anchor="middle" fill="#333">Image</text>
  
  <!-- Arrow 1 -->
  <line x1="170" y1="110" x2="220" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Tokenizer -->
  <rect x="220" y="60" width="120" height="100" fill="#B8E6B8" stroke="#333" stroke-width="2"/>
  <text x="280" y="105" font-size="14" text-anchor="middle" fill="#333">Tokenizer</text>
  <text x="280" y="125" font-size="11" text-anchor="middle" fill="#666">(Denoising)</text>
  
  <!-- Arrow 2 -->
  <line x1="340" y1="110" x2="390" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Token Representation -->
  <rect x="390" y="60" width="180" height="100" fill="#FFE8CC" stroke="#333" stroke-width="2"/>
  <text x="480" y="85" font-size="12" text-anchor="middle" fill="#333">Discrete Token</text>
  <text x="480" y="100" font-size="12" text-anchor="middle" fill="#333">Vocabulary</text>
  <text x="430" y="125" font-size="11" fill="#666">[3, 7, 2, 5,</text>
  <text x="430" y="145" font-size="11" fill="#666">9, 1, 4, 8...]</text>
  
  <!-- Arrow 3 -->
  <line x1="570" y1="110" x2="620" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decoder -->
  <rect x="620" y="60" width="120" height="100" fill="#D4B8E6" stroke="#333" stroke-width="2"/>
  <text x="680" y="105" font-size="14" text-anchor="middle" fill="#333">Decoder</text>
  <text x="680" y="125" font-size="11" text-anchor="middle" fill="#666">(Reconstruction)</text>
  
  <!-- Arrow 4 -->
  <line x1="740" y1="110" x2="790" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Reconstructed Image -->
  <rect x="790" y="60" width="120" height="100" fill="#E8F4F8" stroke="#333" stroke-width="2"/>
  <text x="850" y="105" font-size="14" text-anchor="middle" fill="#333">Reconstructed</text>
  <text x="850" y="125" font-size="14" text-anchor="middle" fill="#333">Image</text>
  
  <!-- Connection annotation between stages -->
  <text x="50" y="200" font-size="13" font-style="italic" fill="#666">Token vocabulary from Stage 1 used as prediction targets in Stage 2</text>
  <line x1="480" y1="160" x2="480" y2="258" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="480" y1="258" x2="400" y2="258" stroke="#999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 2 Label -->
  <text x="50" y="290" font-size="18" font-weight="bold" fill="#333">Stage 2: BEIT Pre-training (Masked Image Modeling)</text>
  
  <!-- Image Input -->
  <rect x="50" y="320" width="100" height="80" fill="#E8F4F8" stroke="#333" stroke-width="2"/>
  <text x="100" y="355" font-size="14" text-anchor="middle" fill="#333">Image</text>
  <text x="100" y="375" font-size="14" text-anchor="middle" fill="#333">Input</text>
  
  <!-- Arrow to Image Patches -->
  <line x1="100" y1="400" x2="100" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Image Patches Grid with masking -->
  <rect x="30" y="450" width="140" height="140" fill="#F0F0F0" stroke="#333" stroke-width="2"/>
  <text x="100" y="440" font-size="12" text-anchor="middle" fill="#333">Image Patches (16x16)</text>
  <!-- 4x4 Grid showing visible (light) and masked (gray) patches -->
  <rect x="40" y="460" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="55" y="479" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="75" y="460" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="90" y="479" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="110" y="460" width="30" height="30" fill="#CCC" stroke="#666" stroke-width="2"/>
  <text x="125" y="479" font-size="9" text-anchor="middle" fill="#333">M</text>
  <rect x="145" y="460" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="160" y="479" font-size="9" text-anchor="middle" fill="#333">V</text>
  
  <rect x="40" y="495" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="55" y="514" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="75" y="495" width="30" height="30" fill="#CCC" stroke="#666" stroke-width="2"/>
  <text x="90" y="514" font-size="9" text-anchor="middle" fill="#333">M</text>
  <rect x="110" y="495" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="125" y="514" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="145" y="495" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="160" y="514" font-size="9" text-anchor="middle" fill="#333">V</text>
  
  <rect x="40" y="530" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="55" y="549" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="75" y="530" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="90" y="549" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="110" y="530" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="125" y="549" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="145" y="530" width="30" height="30" fill="#CCC" stroke="#666" stroke-width="2"/>
  <text x="160" y="549" font-size="9" text-anchor="middle" fill="#333">M</text>
  
  <rect x="40" y="565" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="55" y="584" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="75" y="565" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="90" y="584" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="110" y="565" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="125" y="584" font-size="9" text-anchor="middle" fill="#333">V</text>
  <rect x="145" y="565" width="30" height="30" fill="#E8F4F8" stroke="#666" stroke-width="1"/>
  <text x="160" y="584" font-size="9" text-anchor="middle" fill="#333">V</text>
  
  <text x="100" y="610" font-size="10" text-anchor="middle" fill="#666">V=Visible, M=Masked</text>
  <text x="100" y="625" font-size="10" text-anchor="middle" fill="#D00">(~75% masked)</text>
  
  <!-- Arrow from patches to embedding -->
  <line x1="170" y1="520" x2="220" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Patch Embedding -->
  <rect x="220" y="480" width="140" height="80" fill="#FFD9B8" stroke="#333" stroke-width="2"/>
  <text x="290" y="508" font-size="13" text-anchor="middle" fill="#333">Patch</text>
  <text x="290" y="528" font-size="13" text-anchor="middle" fill="#333">Embedding</text>
  <text x="290" y="548" font-size="10" fill="#666">[E0, E1, ..., En]</text>
  
  <!-- Position Embedding (parallel) -->
  <rect x="220" y="640" width="140" height="80" fill="#D9B8FF" stroke="#333" stroke-width="2"/>
  <text x="290" y="668" font-size="13" text-anchor="middle" fill="#333">Position</text>
  <text x="290" y="688" font-size="13" text-anchor="middle" fill="#333">Embedding</text>
  <text x="290" y="708" font-size="10" fill="#666">[P0, P1, ..., Pn]</text>
  
  <!-- Addition symbol combining embeddings -->
  <circle cx="400" cy="600" r="20" fill="#FFF" stroke="#333" stroke-width="2"/>
  <line x1="390" y1="600" x2="410" y2="600" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="590" x2="400" y2="610" stroke="#333" stroke-width="2"/>
  
  <!-- Arrows to addition -->
  <line x1="360" y1="520" x2="382" y2="586" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="680" x2="382" y2="614" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from addition to encoder -->
  <line x1="420" y1="600" x2="470" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- BEiT Encoder (centrally positioned) -->
  <rect x="470" y="530" width="280" height="160" fill="#B8D4E6" stroke="#333" stroke-width="2"/>
  <text x="610" y="568" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">BEiT Encoder</text>
  <text x="610" y="593" font-size="12" text-anchor="middle" fill="#666">Transformer Layers</text>
  <text x="610" y="613" font-size="12" text-anchor="middle" fill="#666">with Self-Attention</text>
  <text x="610" y="633" font-size="11" text-anchor="middle" fill="#666">Input: Visible patches only</text>
  <text x="610" y="653" font-size="11" text-anchor="middle" fill="#666">Output: [H0, H1, ..., Hn]</text>
  <text x="610" y="673" font-size="10" text-anchor="middle" font-style="italic" fill="#D00">Rich hidden representation</text>
  
  <!-- Arrow from encoder to MIM head -->
  <line x1="610" y1="530" x2="610" y2="480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Masked Image Modeling Head -->
  <rect x="420" y="380" width="380" height="100" fill="#E6B8D4" stroke="#333" stroke-width="2"/>
  <text x="610" y="408" font-size="15" text-anchor="middle" font-weight="bold" fill="#333">Masked Image Modeling Head</text>
  <text x="610" y="428" font-size="12" text-anchor="middle" fill="#666">Predicts token IDs for masked positions</text>
  <text x="610" y="448" font-size="11" text-anchor="middle" fill="#666">Output: [T3, T6, T12] (predicted tokens)</text>
  <text x="610" y="464" font-size="10" text-anchor="middle" fill="#666">Loss: Cross-Entropy vs frozen tokenizer targets</text>
  
  <!-- Visual Tokens as targets (from frozen tokenizer) -->
  <rect x="220" y="260" width="180" height="100" fill="#FFE8CC" stroke="#333" stroke-width="2"/>
  <text x="310" y="280" font-size="12" text-anchor="middle" fill="#333">Target Visual Tokens</text>
  <text x="310" y="295" font-size="12" text-anchor="middle" fill="#333">(from frozen tokenizer)</text>
  <text x="250" y="318" font-size="11" fill="#666">[3, 7, ?, 5,</text>
  <text x="250" y="333" font-size="11" fill="#666">9, ?, 4, ?...]</text>
  <text x="310" y="350" font-size="10" text-anchor="middle" fill="#D00">? = masked positions</text>
  
  <!-- Arrow from image to tokenizer -->
  <line x1="150" y1="360" x2="220" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Tokenizer with Lock (frozen) -->
  <rect x="450" y="260" width="140" height="100" fill="#B8E6B8" stroke="#333" stroke-width="2"/>
  <text x="520" y="295" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Tokenizer</text>
  <text x="520" y="315" font-size="12" text-anchor="middle" fill="#D00">FROZEN</text>
  <text x="520" y="332" font-size="11" text-anchor="middle" fill="#666">from Stage 1</text>
  <text x="520" y="347" font-size="10" text-anchor="middle" fill="#666">(Denoising)</text>
  <!-- Lock icon -->
  <circle cx="565" cy="280" r="10" fill="none" stroke="#D00" stroke-width="2"/>
  <rect x="562" y="285" width="6" height="10" fill="none" stroke="#D00" stroke-width="2"/>
  <line x1="560" y1="280" x2="570" y2="280" stroke="#D00" stroke-width="2"/>
  
  <!-- Arrow from tokenizer to targets -->
  <line x1="450" y1="310" x2="400" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Prediction arrow from MIM head to targets (supervision signal) -->
  <line x1="420" y1="430" x2="400" y2="430" stroke="#D00" stroke-width="2"/>
  <line x1="400" y1="430" x2="400" y2="360" stroke="#D00" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="405" y="410" font-size="10" font-weight="bold" fill="#D00">Predicts</text>
  
  <!-- Loss indicator -->
  <circle cx="850" cy="430" r="32" fill="#FFE8E8" stroke="#D00" stroke-width="2"/>
  <text x="850" y="425" font-size="12" text-anchor="middle" font-weight="bold" fill="#D00">Loss</text>
  <text x="850" y="440" font-size="10" text-anchor="middle" fill="#D00">Cross-Entropy</text>
  
  <!-- Arrow from MIM head to loss -->
  <line x1="800" y1="430" x2="818" y2="430" stroke="#D00" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  
  <!-- Annotation about learning semantic regions -->
  <text x="470" y="725" font-size="11" font-style="italic" fill="#666">Self-attention learns to distinguish semantic regions</text>
  <text x="470" y="740" font-size="11" font-style="italic" fill="#666">without task-specific supervision</text>
  
  <!-- Transfer learning annotation -->
  <text x="50" y="780" font-size="13" font-weight="bold" fill="#333">After Pre-training:</text>
  <text x="50" y="800" font-size="11" fill="#666">Pre-trained BEiT encoder transfers to downstream tasks</text>
  <text x="50" y="815" font-size="11" fill="#666">(classification, segmentation, detection) via fine-tuning</text>
  
  <!-- Annotation for reconstruction capability -->
  <text x="50" y="850" font-size="11" font-style="italic" fill="#666">Note: MAE can infer complex reconstructions even with 95% masking,</text>
  <text x="50" y="865" font-size="11" font-style="italic" fill="#666">suggesting learned semantics via rich hidden representations</text>
</svg>