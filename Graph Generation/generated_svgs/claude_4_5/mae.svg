<svg width="1200" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <pattern id="maskPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#d0d0d0" stroke="#888" stroke-width="2"/>
      <line x1="0" y1="0" x2="40" y2="40" stroke="#999" stroke-width="1"/>
      <line x1="40" y1="0" x2="0" y2="40" stroke="#999" stroke-width="1"/>
    </pattern>
    <pattern id="visiblePattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#4a7ba7" stroke="#2d5a7b" stroke-width="2"/>
    </pattern>
    <pattern id="targetPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#90c890" stroke="#5a7b2d" stroke-width="2"/>
    </pattern>
    <pattern id="reconstructedPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#b8e0b8" stroke="#7ba74a" stroke-width="1" stroke-dasharray="3,3"/>
    </pattern>
  </defs>
  
  <!-- Title -->
  <text x="600" y="25" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Masked Autoencoder (MAE) Architecture</text>
  
  <!-- Input Image Section -->
  <g id="input">
    <text x="100" y="65" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Input Image</text>
    
    <!-- Input grid with masked patches (75% masked) -->
    <rect x="20" y="90" width="160" height="160" fill="url(#maskPattern)"/>
    
    <!-- Visible patches (unmasked - 25% visible) -->
    <rect x="20" y="90" width="40" height="40" fill="url(#visiblePattern)"/>
    <rect x="100" y="130" width="40" height="40" fill="url(#visiblePattern)"/>
    <rect x="140" y="170" width="40" height="40" fill="url(#visiblePattern)"/>
    <rect x="60" y="210" width="40" height="40" fill="url(#visiblePattern)"/>
    
    <text x="100" y="275" font-size="12" text-anchor="middle" fill="#555">Random masking: 75% ratio</text>
    <text x="100" y="290" font-size="11" text-anchor="middle" fill="#777">Only 25% visible patches processed</text>
  </g>
  
  <!-- Arrow from visible patches to Encoder -->
  <line x1="180" y1="170" x2="260" y2="170" stroke="#4a7ba7" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="220" y="153" font-size="11" text-anchor="middle" fill="#555">visible patches</text>
  <text x="220" y="166" font-size="11" text-anchor="middle" fill="#555">with positional</text>
  <text x="220" y="179" font-size="11" text-anchor="middle" fill="#555">embeddings</text>
  
  <!-- Encoder Block (lightweight - narrower) -->
  <g id="encoder">
    <rect x="260" y="100" width="110" height="340" fill="#4a7ba7" stroke="#2d5a7b" stroke-width="3" rx="5"/>
    <text x="315" y="125" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Encoder</text>
    <text x="315" y="140" font-size="10" text-anchor="middle" fill="#e0e0e0">(Lightweight)</text>
    
    <!-- Encoder components -->
    <rect x="273" y="155" width="84" height="45" fill="#6b9bd1" stroke="#4a7ba7" stroke-width="1" rx="3"/>
    <text x="315" y="175" font-size="11" text-anchor="middle" fill="white">Patch Embedding</text>
    <text x="315" y="190" font-size="10" text-anchor="middle" fill="white">+ Pos. Encoding</text>
    
    <rect x="273" y="210" width="84" height="55" fill="#6b9bd1" stroke="#4a7ba7" stroke-width="1" rx="3"/>
    <text x="315" y="228" font-size="11" text-anchor="middle" fill="white">Transformer</text>
    <text x="315" y="241" font-size="10" text-anchor="middle" fill="white">Multi-Head</text>
    <text x="315" y="254" font-size="10" text-anchor="middle" fill="white">Self-Attention</text>
    
    <rect x="273" y="275" width="84" height="40" fill="#6b9bd1" stroke="#4a7ba7" stroke-width="1" rx="3"/>
    <text x="315" y="293" font-size="11" text-anchor="middle" fill="white">Deep Blocks</text>
    <text x="315" y="306" font-size="9" text-anchor="middle" fill="white">(fewer layers)</text>
    
    <rect x="273" y="325" width="84" height="45" fill="#6b9bd1" stroke="#4a7ba7" stroke-width="1" rx="3"/>
    <text x="315" y="345" font-size="11" text-anchor="middle" fill="white">Latent</text>
    <text x="315" y="360" font-size="11" text-anchor="middle" fill="white">Representations</text>
    
    <rect x="273" y="380" width="84" height="45" fill="#5a8fc7" stroke="#4a7ba7" stroke-width="1" rx="3"/>
    <text x="315" y="398" font-size="10" text-anchor="middle" fill="white">Learned Features</text>
    <text x="315" y="411" font-size="10" text-anchor="middle" fill="white">from visible patches</text>
  </g>
  
  <!-- Arrow from Encoder to Decoder -->
  <line x1="370" y1="270" x2="490" y2="270" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="430" y="255" font-size="11" text-anchor="middle" fill="#555">latent representations</text>
  <text x="430" y="268" font-size="11" text-anchor="middle" fill="#555">combined with</text>
  <text x="430" y="281" font-size="11" text-anchor="middle" fill="#c85050" font-weight="bold">mask tokens</text>
  <text x="430" y="294" font-size="10" text-anchor="middle" fill="#777">(learned embeddings)</text>
  
  <!-- Decoder Block (heavier - wider) -->
  <g id="decoder">
    <rect x="490" y="100" width="170" height="340" fill="#7ba74a" stroke="#5a7b2d" stroke-width="3" rx="5"/>
    <text x="575" y="125" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Decoder</text>
    <text x="575" y="140" font-size="10" text-anchor="middle" fill="#e0e0e0">(Heavier - more layers)</text>
    
    <!-- Decoder components -->
    <rect x="505" y="155" width="140" height="45" fill="#90c890" stroke="#7ba74a" stroke-width="1" rx="3"/>
    <text x="575" y="175" font-size="11" text-anchor="middle" fill="white">Token Fusion</text>
    <text x="575" y="190" font-size="10" text-anchor="middle" fill="white">+ Pos. Encoding</text>
    
    <rect x="505" y="210" width="140" height="55" fill="#90c890" stroke="#7ba74a" stroke-width="1" rx="3"/>
    <text x="575" y="228" font-size="11" text-anchor="middle" fill="white">Transformer Blocks</text>
    <text x="575" y="241" font-size="10" text-anchor="middle" fill="white">Cross-Attention</text>
    <text x="575" y="254" font-size="10" text-anchor="middle" fill="white">Self-Attention</text>
    
    <rect x="505" y="275" width="140" height="50" fill="#90c890" stroke="#7ba74a" stroke-width="1" rx="3"/>
    <text x="575" y="295" font-size="11" text-anchor="middle" fill="white">Reconstruction Blocks</text>
    <text x="575" y="308" font-size="9" text-anchor="middle" fill="white">(deeper processing)</text>
    <text x="575" y="318" font-size="9" text-anchor="middle" fill="white">(more layers)</text>
    
    <rect x="505" y="335" width="140" height="40" fill="#90c890" stroke="#7ba74a" stroke-width="1" rx="3"/>
    <text x="575" y="353" font-size="11" text-anchor="middle" fill="white">Pixel Prediction</text>
    <text x="575" y="366" font-size="10" text-anchor="middle" fill="white">for all patches</text>
    
    <rect x="505" y="385" width="140" height="40" fill="#a0d8a0" stroke="#7ba74a" stroke-width="1" rx="3"/>
    <text x="575" y="403" font-size="10" text-anchor="middle" fill="white">Full Image Output</text>
    <text x="575" y="416" font-size="9" text-anchor="middle" fill="white">(visible + masked)</text>
  </g>
  
  <!-- Arrow from Decoder to Reconstruction Target -->
  <line x1="660" y1="170" x2="890" y2="170" stroke="#7ba74a" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="775" y="158" font-size="11" text-anchor="middle" fill="#555">predicted pixels</text>
  <text x="775" y="171" font-size="11" text-anchor="middle" fill="#555">for all patches</text>
  
  <!-- Reconstruction Target Section -->
  <g id="target">
    <text x="990" y="65" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Reconstruction Target</text>
    
    <!-- Target grid - showing both original visible and reconstructed -->
    <rect x="910" y="90" width="160" height="160" fill="url(#reconstructedPattern)"/>
    
    <!-- Original visible patches marked -->
    <rect x="910" y="90" width="40" height="40" fill="url(#visiblePattern)"/>
    <rect x="990" y="130" width="40" height="40" fill="url(#visiblePattern)"/>
    <rect x="1030" y="170" width="40" height="40" fill="url(#visiblePattern)"/>
    <rect x="950" y="210" width="40" height="40" fill="url(#visiblePattern)"/>
    
    <!-- Reconstructed masked patches -->
    <rect x="950" y="90" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="990" y="90" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="1030" y="90" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="910" y="130" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="950" y="130" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="1030" y="130" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="910" y="170" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="950" y="170" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="990" y="170" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="910" y="210" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="990" y="210" width="40" height="40" fill="url(#targetPattern)"/>
    <rect x="1030" y="210" width="40" height="40" fill="url(#targetPattern)"/>
    
    <text x="990" y="275" font-size="12" text-anchor="middle" fill="#555">Complete Reconstruction</text>
    <text x="990" y="290" font-size="11" text-anchor="middle" fill="#777">(visible + masked patches)</text>
  </g>
  
  <!-- Loss computation integrated into diagram flow -->
  <g id="loss">
    <rect x="895" y="310" width="190" height="80" fill="#fff0f0" stroke="#c85050" stroke-width="2" rx="5"/>
    <text x="990" y="332" font-size="13" font-weight="bold" text-anchor="middle" fill="#c85050">Loss Computation</text>
    <text x="990" y="350" font-size="11" text-anchor="middle" fill="#555">MSE on masked patches only</text>
    <text x="990" y="365" font-size="10" text-anchor="middle" fill="#777">Self-supervised learning objective</text>
    <text x="990" y="380" font-size="10" text-anchor="middle" fill="#777">Learns holistic semantic representations</text>
  </g>
  
  <!-- Feedback arrow from loss to input -->
  <line x1="895" y1="350" x2="180" y2="350" stroke="#c85050" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="537" y="368" font-size="10" text-anchor="middle" fill="#c85050">training feedback loop</text>
  
  <!-- Additional architectural details -->
  <text x="315" y="55" font-size="10" text-anchor="middle" fill="#4a7ba7" font-weight="bold">Processes 25% of patches</text>
  <text x="315" y="68" font-size="9" text-anchor="middle" fill="#4a7ba7">3x faster than full image</text>
  
  <text x="575" y="55" font-size="10" text-anchor="middle" fill="#7ba74a" font-weight="bold">Processes all tokens</text>
  <text x="575" y="68" font-size="9" text-anchor="middle" fill="#7ba74a">Reconstructs complete image</text>
  
  <!-- Highlight asymmetric design -->
  <text x="430" y="415" font-size="10" text-anchor="middle" fill="#333" font-style="italic">Asymmetric encoder-decoder design enables efficiency</text>
  <text x="430" y="430" font-size="9" text-anchor="middle" fill="#666">Lightweight encoder extracts features from visible patches only</text>
  <text x="430" y="443" font-size="9" text-anchor="middle" fill="#666">Heavier decoder reconstructs full image from partial information</text>
</svg>