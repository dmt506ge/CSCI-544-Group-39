<svg width="1400" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="700" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Memory-Based Adapter Architecture</text>
  
  <!-- Top Section: Point cloud adapter -->
  <g id="top-section">
    <!-- Section Label -->
    <rect x="100" y="80" width="1200" height="320" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,5" rx="10"/>
    <text x="150" y="110" font-size="16" font-weight="bold" fill="#1f2937">Point cloud adapter</text>
    
    <!-- Left: Initial voxel grid -->
    <g id="initial-voxels">
      <!-- Teal voxels (current features) -->
      <rect x="180" y="150" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="192" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      <rect x="210" y="150" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="222" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      <rect x="180" y="180" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="192" y="198" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      <!-- Yellow voxels (updated features) -->
      <rect x="210" y="180" width="25" height="25" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <text x="222" y="198" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">upd</text>
      <rect x="240" y="150" width="25" height="25" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <text x="252" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">upd</text>
      <!-- Gray voxels (previous features) -->
      <rect x="240" y="180" width="25" height="25" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <text x="252" y="198" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">prv</text>
      <rect x="180" y="210" width="25" height="25" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <text x="192" y="228" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">prv</text>
      <rect x="210" y="210" width="25" height="25" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <text x="222" y="228" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">prv</text>
      <rect x="240" y="210" width="25" height="25" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <text x="252" y="228" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">prv</text>
      
      <text x="212" y="260" font-size="12" text-anchor="middle" fill="#374151">Input Voxels (t)</text>
    </g>
    
    <!-- Arrow: sparsify -->
    <line x1="265" y1="190" x2="350" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="307" y="180" font-size="13" text-anchor="middle" fill="#1f2937">sparsify</text>
    
    <!-- Center: Sparse representation -->
    <g id="sparse-voxels">
      <rect x="360" y="160" width="20" height="20" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <rect x="385" y="160" width="20" height="20" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <rect x="360" y="185" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="385" y="185" width="20" height="20" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      
      <text x="372" y="230" font-size="12" text-anchor="middle" fill="#374151">Sparse</text>
    </g>
    
    <!-- Arrow: aggregate with attention -->
    <line x1="410" y1="190" x2="495" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="452" y="175" font-size="13" text-anchor="middle" fill="#1f2937">aggregate</text>
    <text x="452" y="215" font-size="10" text-anchor="middle" fill="#6b7280">(Attention fusion)</text>
    
    <!-- Aggregated features (red blocks) -->
    <g id="aggregated-voxels">
      <rect x="505" y="150" width="25" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
      <text x="517" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">agg</text>
      <rect x="535" y="150" width="25" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
      <text x="547" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">agg</text>
      <rect x="565" y="150" width="25" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
      <text x="577" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">agg</text>
      <rect x="505" y="180" width="25" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
      <text x="517" y="198" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">agg</text>
      <rect x="535" y="180" width="25" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
      <text x="547" y="198" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">agg</text>
      <rect x="565" y="180" width="25" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
      <text x="577" y="198" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">agg</text>
      <rect x="505" y="210" width="25" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
      <text x="517" y="228" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">agg</text>
      <rect x="535" y="210" width="25" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
      <text x="547" y="228" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">agg</text>
      <rect x="565" y="210" width="25" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
      <text x="577" y="228" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">agg</text>
      
      <text x="535" y="260" font-size="12" text-anchor="middle" fill="#374151">Aggregated</text>
    </g>
    
    <!-- Arrow: mapping -->
    <line x1="595" y1="190" x2="680" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="637" y="180" font-size="13" text-anchor="middle" fill="#1f2937">map</text>
    
    <!-- 3D NMS box -->
    <rect x="690" y="175" width="60" height="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
    <text x="720" y="193" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">3D NMS</text>
    
    <!-- Arrow after 3D NMS -->
    <line x1="750" y1="190" x2="820" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Right: Point features (scattered red dots) -->
    <g id="point-features">
      <circle cx="850" cy="160" r="5" fill="#ef4444"/>
      <circle cx="870" cy="175" r="5" fill="#ef4444"/>
      <circle cx="890" cy="165" r="5" fill="#ef4444"/>
      <circle cx="855" cy="190" r="5" fill="#ef4444"/>
      <circle cx="880" cy="195" r="5" fill="#ef4444"/>
      <circle cx="865" cy="210" r="5" fill="#ef4444"/>
      <circle cx="895" cy="205" r="5" fill="#ef4444"/>
      <circle cx="885" cy="220" r="5" fill="#ef4444"/>
      
      <text x="872" y="250" font-size="12" text-anchor="middle" fill="#374151">Point Features</text>
      <text x="872" y="265" font-size="10" text-anchor="middle" fill="#6b7280">(instance masks)</text>
    </g>
    
    <!-- Query arrow (loop back) from Point Features to Input Voxels -->
    <path d="M 850 155 Q 850 100 212 100 Q 212 120 212 145" 
          fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-blue)"/>
    <text x="530" y="95" font-size="13" text-anchor="middle" fill="#2563eb">query (ROI-level)</text>
    
    <!-- Add arrow (downward to memory) -->
    <line x1="515" y1="240" x2="515" y2="420" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>
    <text x="475" y="340" font-size="13" fill="#16a34a">add</text>
  </g>
  
  <!-- Bottom Section: Point cloud memory -->
  <g id="bottom-section">
    <!-- Section Label -->
    <rect x="100" y="440" width="1200" height="280" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,5" rx="10"/>
    <text x="150" y="470" font-size="16" font-weight="bold" fill="#1f2937">Point cloud memory</text>
    
    <!-- Left: Current frame voxelize -->
    <g id="current-voxels">
      <rect x="180" y="510" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="192" y="528" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      <rect x="210" y="510" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="222" y="528" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      <rect x="180" y="540" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="192" y="558" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      <rect x="210" y="540" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="222" y="558" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      
      <text x="195" y="590" font-size="12" text-anchor="middle" fill="#374151">voxelize (t)</text>
      <text x="195" y="605" font-size="10" text-anchor="middle" fill="#14b8a6">current frame</text>
    </g>
    
    <!-- Arrow: merge -->
    <line x1="240" y1="540" x2="350" y2="540" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="295" y="530" font-size="13" text-anchor="middle" fill="#1f2937">merge</text>
    
    <!-- Center: Previous memory (tall stack of gray voxels) -->
    <g id="previous-memory">
      <rect x="360" y="490" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="385" y="490" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="360" y="515" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="385" y="515" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="360" y="540" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="385" y="540" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="360" y="565" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="385" y="565" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="360" y="590" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="385" y="590" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="360" y="615" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <rect x="385" y="615" width="20" height="20" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      
      <text x="372" y="655" font-size="12" text-anchor="middle" fill="#374151">Queue (t-1)</text>
      <text x="372" y="670" font-size="10" text-anchor="middle" fill="#6b7280">temporal cache</text>
    </g>
    
    <!-- Arrow: update -->
    <line x1="410" y1="540" x2="505" y2="540" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="457" y="530" font-size="13" text-anchor="middle" fill="#1f2937">update</text>
    
    <!-- Right: Updated memory (composite colored voxels) -->
    <g id="updated-memory">
      <!-- Teal voxels (current) -->
      <rect x="515" y="510" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="527" y="528" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      <rect x="545" y="510" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="557" y="528" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      <rect x="515" y="540" width="25" height="25" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
      <text x="527" y="558" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">cur</text>
      <!-- Yellow voxels (updated) -->
      <rect x="545" y="540" width="25" height="25" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <text x="557" y="558" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">upd</text>
      <rect x="575" y="510" width="25" height="25" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <text x="587" y="528" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">upd</text>
      <!-- Gray voxels (previous) -->
      <rect x="575" y="540" width="25" height="25" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <text x="587" y="558" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">prv</text>
      <rect x="515" y="570" width="25" height="25" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <text x="527" y="588" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">prv</text>
      <rect x="545" y="570" width="25" height="25" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <text x="557" y="588" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">prv</text>
      <rect x="575" y="570" width="25" height="25" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
      <text x="587" y="588" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">prv</text>
      
      <text x="545" y="615" font-size="12" text-anchor="middle" fill="#374151">Queue (t)</text>
      <text x="545" y="630" font-size="10" text-anchor="middle" fill="#6b7280">updated memory</text>
    </g>
    
    <!-- Loop arrow from updated memory back to adapter -->
    <path d="M 600 540 Q 680 540 680 395" 
          fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-blue)"/>
    <text x="705" y="460" font-size="13" fill="#2563eb">feedback</text>
  </g>
  
  <!-- Connection from top section input to bottom section -->
  <line x1="212" y1="275" x2="212" y2="505" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="185" y="385" font-size="12" fill="#16a34a">current</text>
  <text x="185" y="400" font-size="12" fill="#16a34a">frame</text>
</svg>