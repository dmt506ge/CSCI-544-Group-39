<svg width="1400" height="750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#d84315" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7b1fa2" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff6f00" />
    </marker>
  </defs>
  
  <!-- Server Cloud -->
  <ellipse cx="120" cy="80" rx="90" ry="55" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="120" y="70" font-size="14" text-anchor="middle" font-weight="bold" fill="#1976d2">Server</text>
  <text x="120" y="88" font-size="14" text-anchor="middle" fill="#1976d2">Aggregation</text>
  <text x="120" y="104" font-size="10" text-anchor="middle" fill="#1976d2" font-style="italic">(Fed. Averaging)</text>
  
  <!-- Global item embedding C (top) -->
  <rect x="60" y="180" width="120" height="70" fill="#fff9c4" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="120" y="205" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Global item</text>
  <text x="120" y="223" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">embedding</text>
  <text x="120" y="241" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">(C)</text>
  
  <!-- Download arrow -->
  <line x1="120" y1="135" x2="120" y2="180" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="145" y="155" font-size="11" fill="#0066cc" font-weight="bold">Download</text>
  <text x="145" y="168" font-size="9" fill="#0066cc" font-style="italic">(Only C)</text>
  
  <!-- Upload arrow -->
  <path d="M 90 180 Q 70 150 85 135" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead-blue)" fill="none"/>
  <text x="25" y="145" font-size="11" fill="#0066cc" font-weight="bold">Upload</text>
  <text x="25" y="158" font-size="9" fill="#0066cc" font-style="italic">(Sparse C)</text>
  
  <!-- Left green dashed box (Personalization) -->
  <rect x="30" y="160" width="450" height="440" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="8,4" rx="10"/>
  <text x="255" y="590" font-size="15" text-anchor="middle" font-weight="bold" fill="#4caf50">Personalization (Client-Side)</text>
  
  <!-- Enforce Difference - better centered between C and D/u -->
  <rect x="250" y="280" width="140" height="55" fill="#ffccbc" stroke="#d84315" stroke-width="2" rx="5"/>
  <text x="320" y="303" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">Enforce</text>
  <text x="320" y="320" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">Difference</text>
  
  <!-- L1 Sparsity annotation connected to C -->
  <text x="200" y="265" font-size="10" text-anchor="middle" fill="#d84315" font-weight="bold">L1 Sparsity</text>
  <text x="200" y="278" font-size="10" text-anchor="middle" fill="#d84315" font-weight="bold">on C</text>
  <line x1="180" y1="250" x2="180" y2="270" stroke="#d84315" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Bidirectional constraint arrows from Enforce Difference -->
  <line x1="250" y1="295" x2="180" y2="245" stroke="#d84315" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="250" y1="318" x2="200" y2="375" stroke="#d84315" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="320" y1="335" x2="320" y2="365" stroke="#d84315" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Local item embedding D(i) with privacy indicator -->
  <rect x="85" y="375" width="115" height="75" fill="#c8e6c9" stroke="#388e3c" stroke-width="3" rx="5" stroke-dasharray="3,2"/>
  <text x="142" y="398" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">Local item</text>
  <text x="142" y="415" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">embedding</text>
  <text x="142" y="433" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">(D(i))</text>
  <text x="142" y="447" font-size="9" text-anchor="middle" fill="#388e3c" font-style="italic">Client-Private</text>
  
  <!-- User embedding u_i with privacy indicator -->
  <rect x="285" y="375" width="115" height="75" fill="#c8e6c9" stroke="#388e3c" stroke-width="3" rx="5" stroke-dasharray="3,2"/>
  <text x="342" y="398" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">User</text>
  <text x="342" y="415" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">embedding</text>
  <text x="342" y="433" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">(u_i)</text>
  <text x="342" y="447" font-size="9" text-anchor="middle" fill="#388e3c" font-style="italic">Client-Private</text>
  
  <!-- Arrow from C down to addition -->
  <line x1="120" y1="250" x2="120" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Addition circle (C + D(i)) - enlarged and prominently labeled -->
  <circle cx="170" cy="510" r="30" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="170" y="520" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">+</text>
  
  <!-- Arrow from D(i) to addition -->
  <line x1="142" y1="450" x2="142" y2="500" stroke="#333" stroke-width="2"/>
  <line x1="142" y1="500" x2="148" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Weight Curriculum box - repositioned to avoid overlap -->
  <rect x="60" y="540" width="100" height="45" fill="#ffe0b2" stroke="#ff6f00" stroke-width="2" rx="5"/>
  <text x="110" y="558" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">Weight</text>
  <text x="110" y="572" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">Curriculum</text>
  <text x="110" y="583" font-size="9" text-anchor="middle" fill="#ff6f00" font-style="italic">(tanh)</text>
  
  <!-- Arrow from weight curriculum to addition -->
  <line x1="130" y1="540" x2="155" y2="530" stroke="#ff6f00" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowhead-orange)"/>
  
  <!-- Additive Personalization label - moved away from addition symbol -->
  <text x="230" y="510" font-size="10" text-anchor="middle" fill="#7b1fa2" font-weight="bold">Additive</text>
  <text x="230" y="522" font-size="10" text-anchor="middle" fill="#7b1fa2" font-weight="bold">Personalization</text>
  
  <!-- Personalized item embedding -->
  <rect x="450" y="375" width="130" height="70" fill="#e1bee7" stroke="#7b1fa2" stroke-width="3" rx="5"/>
  <text x="515" y="398" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">Personalized</text>
  <text x="515" y="415" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">item</text>
  <text x="515" y="433" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">embedding</text>
  
  <!-- Arrow from addition to personalized embedding -->
  <line x1="200" y1="510" x2="420" y2="410" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="420" y1="410" x2="450" y2="410" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrowhead-purple)"/>
  
  <!-- Arrow from u_i to multiplication -->
  <line x1="400" y1="412" x2="685" y2="412" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from personalized embedding to multiplication -->
  <line x1="580" y1="410" x2="685" y2="410" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Multiplication circle with label -->
  <circle cx="720" cy="411" r="28" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="720" y="421" font-size="22" text-anchor="middle" font-weight="bold" fill="#333">x</text>
  <text x="720" y="455" font-size="10" text-anchor="middle" fill="#333" font-style="italic">Dot Product</text>
  
  <!-- Right green dashed box (Reconstruction Error) - better bounded -->
  <rect x="670" y="160" width="450" height="440" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="8,4" rx="10"/>
  <text x="895" y="590" font-size="15" text-anchor="middle" font-weight="bold" fill="#4caf50">Reconstruction Error</text>
  
  <!-- User ratings r_i - repositioned at top of error block -->
  <rect x="810" y="185" width="130" height="65" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="875" y="210" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">User ratings</text>
  <text x="875" y="230" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">(r_i)</text>
  <text x="875" y="244" font-size="9" text-anchor="middle" fill="#1976d2" font-style="italic">Ground Truth</text>
  
  <!-- Predicted user ratings -->
  <rect x="810" y="495" width="130" height="70" fill="#c5cae9" stroke="#3f51b5" stroke-width="2" rx="5"/>
  <text x="875" y="518" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">Predicted</text>
  <text x="875" y="535" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">user ratings</text>
  <text x="875" y="552" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">(r_i hat)</text>
  
  <!-- Arrow from multiplication to predicted ratings -->
  <line x1="720" y1="439" x2="720" y2="530" stroke="#333" stroke-width="2"/>
  <line x1="720" y1="530" x2="810" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Compute Loss box -->
  <rect x="1000" y="350" width="110" height="65" fill="#ffcdd2" stroke="#c62828" stroke-width="2" rx="5"/>
  <text x="1055" y="375" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Compute</text>
  <text x="1055" y="393" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Loss</text>
  <text x="1055" y="408" font-size="9" text-anchor="middle" fill="#c62828" font-style="italic">(MSE)</text>
  
  <!-- Arrow from r_i to compute loss -->
  <line x1="940" y1="217" x2="1055" y2="217" stroke="#333" stroke-width="2"/>
  <line x1="1055" y1="217" x2="1055" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from predicted ratings to compute loss -->
  <line x1="940" y1="530" x2="1055" y2="530" stroke="#333" stroke-width="2"/>
  <line x1="1055" y1="530" x2="1055" y2="415" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Backpropagation arrow to embeddings - moved away from r_i box -->
  <path d="M 1000 365 Q 920 365 920 310 Q 920 270 670 270 Q 530 270 430 340" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrowhead-purple)" fill="none" stroke-dasharray="4,2"/>
  <text x="850" y="255" font-size="11" fill="#7b1fa2" font-weight="bold">Backpropagation</text>
  
  <!-- Gradient Update arrows - split to show updates to all parameters -->
  <path d="M 1000 395 Q 860 395 860 540 Q 600 540 515 445" stroke="#d84315" stroke-width="2" marker-end="url(#arrowhead-red)" fill="none" stroke-dasharray="4,2"/>
  <path d="M 850 540 Q 400 540 342 450" stroke="#d84315" stroke-width="2" marker-end="url(#arrowhead-red)" fill="none" stroke-dasharray="4,2"/>
  <path d="M 850 540 Q 400 540 142 450" stroke="#d84315" stroke-width="2" marker-end="url(#arrowhead-red)" fill="none" stroke-dasharray="4,2"/>
  <text x="730" y="525" font-size="11" fill="#d84315" font-weight="bold">Gradient Update</text>
  
  <!-- DP Noise Injection box on gradient path -->
  <rect x="800" y="515" width="110" height="50" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="855" y="535" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">Noise</text>
  <text x="855" y="550" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">Injection</text>
  <text x="855" y="562" font-size="9" text-anchor="middle" fill="#e65100" font-style="italic">(epsilon-delta DP)</text>
  
  <!-- Communication efficiency annotation - repositioned -->
  <text x="30" y="200" font-size="10" fill="#0066cc" font-style="italic">Communication:</text>
  <text x="30" y="213" font-size="10" fill="#0066cc" font-style="italic">Sparse C only</text>
  <text x="30" y="226" font-size="10" fill="#0066cc" font-style="italic">(Low overhead)</text>
  
</svg>