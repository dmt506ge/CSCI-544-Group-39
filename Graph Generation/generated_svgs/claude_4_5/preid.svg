<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e67e22" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8e44ad" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Person Re-Identification System
  </text>
  
  <!-- Training Phase Label -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Training Phase
  </text>
  
  <!-- Multi-camera System -->
  <rect x="50" y="90" width="180" height="140" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="140" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    Multi-camera
  </text>
  <text x="140" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    System
  </text>
  <text x="140" y="160" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">
    Camera-Aware Input
  </text>
  
  <!-- Camera icons with labels -->
  <circle cx="80" cy="185" r="8" fill="white" opacity="0.7"/>
  <text x="80" y="202" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">C1</text>
  <circle cx="140" cy="185" r="8" fill="white" opacity="0.7"/>
  <text x="140" y="202" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">C2</text>
  <circle cx="200" cy="185" r="8" fill="white" opacity="0.7"/>
  <text x="200" y="202" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">C3</text>
  
  <text x="140" y="220" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" opacity="0.9">
    Cross-Camera Views
  </text>
  
  <!-- Arrow from Multi-camera to Images/Videos -->
  <line x1="230" y1="160" x2="270" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Images/Videos Dataset -->
  <rect x="270" y="90" width="200" height="140" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="370" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    Images/Videos
  </text>
  <text x="370" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    Dataset
  </text>
  <text x="370" y="158" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">
    (Tracklets for Video)
  </text>
  <text x="370" y="173" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" opacity="0.9">
    Temporal Sequences
  </text>
  
  <!-- Image placeholders with camera indicators -->
  <rect x="285" y="185" width="30" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="300" y="222" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">C1</text>
  <rect x="320" y="185" width="30" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="335" y="222" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">C2</text>
  <rect x="355" y="185" width="30" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="370" y="222" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">C1</text>
  <rect x="390" y="185" width="30" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="405" y="222" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">C3</text>
  <rect x="425" y="185" width="30" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="440" y="222" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">C2</text>
  
  <!-- Arrow from Images/Videos to Clustering -->
  <line x1="470" y1="160" x2="500" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Clustering Module -->
  <rect x="500" y="90" width="180" height="140" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="590" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Clustering Module
  </text>
  <text x="590" y="136" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Label Assignment
  </text>
  
  <!-- Soft Label Visualization -->
  <rect x="515" y="145" width="150" height="50" rx="3" fill="white" opacity="0.25" stroke="white" stroke-width="1"/>
  <text x="590" y="162" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Soft Labels (Probability)
  </text>
  <text x="530" y="177" font-family="Arial, sans-serif" font-size="8" text-anchor="start" fill="white">
    ID1: 0.85
  </text>
  <text x="530" y="187" font-family="Arial, sans-serif" font-size="8" text-anchor="start" fill="white">
    ID2: 0.12
  </text>
  <text x="610" y="177" font-family="Arial, sans-serif" font-size="8" text-anchor="start" fill="white">
    ID3: 0.03
  </text>
  
  <!-- Clustering icons -->
  <circle cx="525" cy="210" r="6" fill="#f39c12" opacity="0.8"/>
  <circle cx="540" cy="215" r="6" fill="#f39c12" opacity="0.8"/>
  <circle cx="565" cy="210" r="6" fill="#3498db" opacity="0.8"/>
  <circle cx="580" cy="215" r="6" fill="#3498db" opacity="0.8"/>
  <circle cx="605" cy="210" r="6" fill="#27ae60" opacity="0.8"/>
  <circle cx="620" cy="215" r="6" fill="#27ae60" opacity="0.8"/>
  
  <!-- Arrow from Clustering to ReID Model -->
  <line x1="680" y1="160" x2="720" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ReID Model (Training) -->
  <rect x="720" y="80" width="240" height="160" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="840" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Re-ID Model
  </text>
  <text x="840" y="128" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
    Feature Learning
  </text>
  
  <!-- Intra-Camera Learning -->
  <rect x="735" y="138" width="95" height="40" rx="3" fill="#3498db" opacity="0.5" stroke="white" stroke-width="1"/>
  <text x="782" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="bold">
    Intra-Camera
  </text>
  <text x="782" y="168" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">
    Same Camera
  </text>
  
  <!-- Inter-Camera Learning -->
  <rect x="840" y="138" width="95" height="40" rx="3" fill="#16a085" opacity="0.5" stroke="white" stroke-width="1"/>
  <text x="887" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="bold">
    Inter-Camera
  </text>
  <text x="887" y="168" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">
    Cross Camera
  </text>
  
  <!-- Feature Extraction Layer -->
  <rect x="735" y="185" width="200" height="25" rx="3" fill="white" opacity="0.3" stroke="white" stroke-width="1"/>
  <text x="835" y="202" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Feature Embedding Layer
  </text>
  
  <text x="840" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" opacity="0.9">
    Hard-Batch Triplet Loss
  </text>
  
  <!-- Iterative refinement loop from ReID Model back to Clustering -->
  <path d="M 840 80 L 840 60 L 590 60 L 590 90" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arrowhead-orange)"/>
  <text x="715" y="55" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#e67e22" font-weight="bold">
    Iterative Refinement
  </text>
  
  <!-- Arrow from ReID Model to Memory Bank -->
  <line x1="960" y1="160" x2="990" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Memory Bank -->
  <rect x="990" y="90" width="170" height="140" rx="5" fill="#8e44ad" stroke="#6c3483" stroke-width="2"/>
  <text x="1075" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Memory Bank
  </text>
  <text x="1075" y="140" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Feature Lookup Table
  </text>
  <text x="1075" y="156" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" opacity="0.9">
    Identity Feature Vectors
  </text>
  
  <!-- Memory bank visualization with feature vectors -->
  <rect x="1005" y="165" width="18" height="30" fill="white" opacity="0.6" stroke="white" stroke-width="1"/>
  <text x="1014" y="212" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">ID1</text>
  <rect x="1028" y="165" width="18" height="30" fill="white" opacity="0.6" stroke="white" stroke-width="1"/>
  <text x="1037" y="212" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">ID2</text>
  <rect x="1051" y="165" width="18" height="30" fill="white" opacity="0.6" stroke="white" stroke-width="1"/>
  <text x="1060" y="212" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">ID3</text>
  <text x="1078" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="white">...</text>
  <rect x="1095" y="165" width="18" height="30" fill="white" opacity="0.6" stroke="white" stroke-width="1"/>
  <text x="1104" y="212" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">IDN</text>
  <rect x="1118" y="165" width="18" height="30" fill="white" opacity="0.6" stroke="white" stroke-width="1"/>
  <text x="1127" y="212" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">IDM</text>
  
  <!-- Feedback arrow from Memory Bank to Clustering Module -->
  <path d="M 990 130 L 950 130 L 950 80 L 680 80 L 680 90" stroke="#8e44ad" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowhead-purple)"/>
  <text x="815" y="75" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#8e44ad">
    Feature Feedback
  </text>
  
  <!-- Testing Phase Separator -->
  <line x1="50" y1="290" x2="1150" y2="290" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Testing Phase
  </text>
  
  <!-- Query Image/Video Input -->
  <rect x="160" y="360" width="160" height="120" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="240" y="390" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    Query
  </text>
  <text x="240" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    Image/Video
  </text>
  <text x="240" y="428" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">
    Single Person of Interest
  </text>
  
  <!-- Query image representation -->
  <rect x="180" y="440" width="50" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <circle cx="255" cy="455" r="10" fill="white" opacity="0.7"/>
  <text x="255" y="460" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">C?</text>
  
  <!-- Arrow from Query to ReID Model -->
  <line x1="320" y1="420" x2="420" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Gallery Images -->
  <rect x="890" y="360" width="160" height="120" rx="5" fill="#16a085" stroke="#138d75" stroke-width="2"/>
  <text x="970" y="390" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    Gallery
  </text>
  <text x="970" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    Images
  </text>
  <text x="970" y="428" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">
    Multi-Camera Views
  </text>
  
  <!-- Gallery images with camera indicators -->
  <rect x="905" y="440" width="23" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="916" y="457" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#333">C1</text>
  <rect x="932" y="440" width="23" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="943" y="457" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#333">C2</text>
  <rect x="959" y="440" width="23" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="970" y="457" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#333">C1</text>
  <rect x="986" y="440" width="23" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="997" y="457" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#333">C3</text>
  <rect x="1013" y="440" width="23" height="30" fill="white" opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="1024" y="457" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#333">C2</text>
  
  <!-- Arrow from Gallery to ReID Model -->
  <line x1="890" y1="420" x2="790" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Memory Bank to ReID Model (Testing) -->
  <line x1="1075" y1="230" x2="1075" y2="350" stroke="#8e44ad" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="1075" y1="350" x2="790" y2="350" stroke="#8e44ad" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead-purple)"/>
  <text x="930" y="342" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#8e44ad">
    Learned Features
  </text>
  
  <!-- ReID Model (Testing Phase) -->
  <rect x="420" y="350" width="370" height="140" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="605" y="378" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Re-ID Model (Testing)
  </text>
  <text x="605" y="398" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
    Feature Extraction and Matching
  </text>
  
  <!-- Internal components for testing -->
  <rect x="438" y="410" width="150" height="35" rx="3" fill="white" opacity="0.3" stroke="white" stroke-width="1"/>
  <text x="513" y="425" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Feature Extraction
  </text>
  <text x="513" y="438" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" opacity="0.9">
    Query and Gallery
  </text>
  
  <rect x="602" y="410" width="175" height="35" rx="3" fill="white" opacity="0.3" stroke="white" stroke-width="1"/>
  <text x="689" y="423" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Similarity Calculation
  </text>
  <text x="689" y="436" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" opacity="0.9">
    Euclidean / Cosine Distance
  </text>
  
  <!-- Camera-aware processing indicator -->
  <text x="605" y="468" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" opacity="0.9">
    Camera-Aware Feature Processing
  </text>
  <text x="605" y="481" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" opacity="0.8">
    Cross-Camera Invariance
  </text>
  
  <!-- Arrow from ReID Model to Ranking -->
  <line x1="605" y1="490" x2="605" y2="540" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Ranking List -->
  <rect x="420" y="540" width="370" height="180" rx="5" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="605" y="570" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Ranking List
  </text>
  <text x="605" y="590" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
    Best Matches (Sorted by Similarity)
  </text>
  
  <!-- Ranking visualization with detailed matches -->
  <rect x="440" y="605" width="28" height="35" fill="white" opacity="0.8" stroke="white" stroke-width="1"/>
  <text x="454" y="627" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">C2</text>
  <text x="480" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="white" font-weight="bold">
    1. Best Match
  </text>
  <text x="480" y="633" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="white">
    Similarity: 0.95
  </text>
  
  <rect x="440" y="650" width="28" height="35" fill="white" opacity="0.7" stroke="white" stroke-width="1"/>
  <text x="454" y="672" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">C1</text>
  <text x="480" y="665" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="white">
    2. Second Match
  </text>
  <text x="480" y="678" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="white">
    Similarity: 0.87
  </text>
  
  <rect x="440" y="695" width="28" height="35" fill="white" opacity="0.6" stroke="white" stroke-width="1"/>
  <text x="454" y="717" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">C3</text>
  <text x="480" y="710" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="white">
    3. Third Match
  </text>
  <text x="480" y="723" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="white">
    Similarity: 0.76
  </text>
  
  <text x="590" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="white">
    ...
  </text>
  
  <text x="650" y="680" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="white" opacity="0.9">
    Cross-camera ranking
  </text>
  <text x="650" y="695" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="white" opacity="0.9">
    based on learned
  </text>
  <text x="650" y="710" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="white" opacity="0.9">
    invariant features
  </text>
  
</svg>