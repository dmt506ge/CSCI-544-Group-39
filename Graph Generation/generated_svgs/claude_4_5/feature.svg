<svg width="1400" height="750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-bi" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <polygon points="10 0, 0 3, 10 6" fill="#666" />
    </marker>
    <marker id="arrowhead-loss" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#d32f2f" />
    </marker>
    <marker id="arrowhead-gradient" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976d2" />
    </marker>
    <marker id="arrowhead-temporal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#689f38" />
    </marker>
    <marker id="arrowhead-align" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8e24aa" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="700" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">Feature Alignment for Unsupervised Domain Adaptation</text>
  
  <!-- Left Section - Source Domain -->
  <g id="source-domain">
    <rect x="50" y="100" width="100" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <rect x="45" y="95" width="100" height="80" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
    <rect x="40" y="90" width="100" height="80" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="90" y="125" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Labelled</text>
    <text x="90" y="142" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Source</text>
    <text x="90" y="159" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Domain</text>
  </g>
  
  <!-- Left Section - Target Domain -->
  <g id="target-domain">
    <rect x="50" y="440" width="100" height="80" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <rect x="45" y="435" width="100" height="80" fill="#ffe0b2" stroke="#f57c00" stroke-width="2"/>
    <rect x="40" y="430" width="100" height="80" fill="#ffcc80" stroke="#f57c00" stroke-width="2"/>
    <text x="90" y="465" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Unlabelled</text>
    <text x="90" y="482" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Target</text>
    <text x="90" y="499" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Domain</text>
  </g>
  
  <!-- Temporal Consistency Module (Integrated) -->
  <g id="temporal-module">
    <rect x="40" y="200" width="100" height="50" fill="#f1f8e9" stroke="#689f38" stroke-width="2" rx="3"/>
    <text x="90" y="220" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Temporal</text>
    <text x="90" y="235" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Consistency</text>
  </g>
  
  <!-- CNN Modules -->
  <g id="cnn-source">
    <rect x="200" y="110" width="80" height="60" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="240" y="140" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">CNN</text>
    <text x="240" y="155" font-size="10" text-anchor="middle" fill="#fff">(trained)</text>
  </g>
  
  <g id="cnn-target">
    <rect x="200" y="450" width="80" height="60" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="240" y="480" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">CNN</text>
    <text x="240" y="495" font-size="10" text-anchor="middle" fill="#fff">(shared)</text>
  </g>
  
  <!-- Arrows from inputs to CNNs -->
  <line x1="140" y1="130" x2="200" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="170" y="125" font-size="9" text-anchor="middle" fill="#555">images</text>
  
  <line x1="140" y1="470" x2="200" y2="480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="170" y="465" font-size="9" text-anchor="middle" fill="#555">images</text>
  
  <!-- Temporal input to CNNs -->
  <line x1="140" y1="225" x2="200" y2="150" stroke="#689f38" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead-temporal)"/>
  <text x="160" y="190" font-size="8" text-anchor="middle" fill="#689f38">tracklets</text>
  
  <line x1="140" y1="225" x2="200" y2="470" stroke="#689f38" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead-temporal)"/>
  
  <!-- Feature Maps -->
  <g id="feature-map-source">
    <rect x="340" y="100" width="120" height="80" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2" rx="5"/>
    <text x="400" y="130" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Feature Map</text>
    <text x="400" y="150" font-size="13" text-anchor="middle" fill="#000">(Source)</text>
    <text x="400" y="165" font-size="9" text-anchor="middle" fill="#555">fs</text>
  </g>
  
  <g id="feature-map-target">
    <rect x="340" y="440" width="120" height="80" fill="#ffccbc" stroke="#d84315" stroke-width="2" rx="5"/>
    <text x="400" y="470" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Feature Map</text>
    <text x="400" y="490" font-size="13" text-anchor="middle" fill="#000">(Target)</text>
    <text x="400" y="505" font-size="9" text-anchor="middle" fill="#555">ft</text>
  </g>
  
  <!-- Arrows from CNNs to Feature Maps -->
  <line x1="280" y1="140" x2="340" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="310" y="130" font-size="9" text-anchor="middle" fill="#555">extracted</text>
  <text x="310" y="140" font-size="9" text-anchor="middle" fill="#555">features</text>
  
  <line x1="280" y1="480" x2="340" y2="480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="310" y="470" font-size="9" text-anchor="middle" fill="#555">extracted</text>
  <text x="310" y="480" font-size="9" text-anchor="middle" fill="#555">features</text>
  
  <!-- Enhanced Alignment Module -->
  <g id="alignment-module">
    <rect x="350" y="270" width="100" height="90" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" rx="5"/>
    <text x="400" y="290" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">Alignment</text>
    <text x="400" y="305" font-size="10" text-anchor="middle" fill="#555">Statistical</text>
    <text x="400" y="318" font-size="10" text-anchor="middle" fill="#555">Matching</text>
    <text x="400" y="333" font-size="10" text-anchor="middle" fill="#555">Cross-Domain</text>
    <text x="400" y="346" font-size="10" text-anchor="middle" fill="#555">Mixup</text>
  </g>
  
  <!-- Bidirectional alignment arrows -->
  <line x1="400" y1="180" x2="400" y2="270" stroke="#8e24aa" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-align)"/>
  <text x="415" y="225" font-size="9" text-anchor="start" fill="#8e24aa">align</text>
  
  <line x1="400" y1="360" x2="400" y2="440" stroke="#8e24aa" stroke-width="2" stroke-dasharray="6,3" marker-start="url(#arrowhead-bi)" marker-end="url(#arrowhead-align)"/>
  <text x="415" y="400" font-size="9" text-anchor="start" fill="#8e24aa">align</text>
  
  <!-- Clustering Module -->
  <g id="clustering-module">
    <rect x="520" y="425" width="100" height="70" fill="#fff59d" stroke="#f57f17" stroke-width="2" rx="5"/>
    <text x="570" y="450" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Clustering</text>
    <text x="570" y="467" font-size="11" text-anchor="middle" fill="#000">Pseudo Labels</text>
    <text x="570" y="482" font-size="10" text-anchor="middle" fill="#666">(iterative)</text>
  </g>
  
  <!-- Memory Bank -->
  <g id="memory-bank">
    <rect x="680" y="425" width="100" height="70" fill="#b2dfdb" stroke="#00695c" stroke-width="2" rx="5"/>
    <text x="730" y="450" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Memory Bank</text>
    <text x="730" y="467" font-size="10" text-anchor="middle" fill="#666">(OIM)</text>
    <text x="730" y="482" font-size="9" text-anchor="middle" fill="#666">lookup table</text>
  </g>
  
  <!-- Arrows from Feature Maps to Clustering -->
  <line x1="460" y1="480" x2="520" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="490" y="465" font-size="9" text-anchor="middle" fill="#555">feature</text>
  <text x="490" y="475" font-size="9" text-anchor="middle" fill="#555">vectors</text>
  
  <!-- Arrows from Clustering to Memory Bank -->
  <line x1="620" y1="460" x2="680" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="650" y="450" font-size="9" text-anchor="middle" fill="#555">cluster</text>
  <text x="650" y="460" font-size="9" text-anchor="middle" fill="#555">updates</text>
  
  <!-- Right Section - Hierarchical Structure -->
  <!-- ID-FC Block -->
  <g id="id-fc">
    <rect x="840" y="150" width="100" height="90" fill="#b39ddb" stroke="#512da8" stroke-width="2" rx="5"/>
    <text x="890" y="180" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">ID-FC</text>
    <text x="890" y="197" font-size="10" text-anchor="middle" fill="#000">(Identity)</text>
    <text x="890" y="212" font-size="9" text-anchor="middle" fill="#555">Triplet Loss</text>
    <text x="890" y="227" font-size="9" text-anchor="middle" fill="#555">OIM Loss</text>
  </g>
  
  <!-- Attr-FC Block -->
  <g id="attr-fc">
    <rect x="840" y="380" width="100" height="90" fill="#80cbc4" stroke="#00695c" stroke-width="2" rx="5"/>
    <text x="890" y="410" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Attr-FC</text>
    <text x="890" y="427" font-size="10" text-anchor="middle" fill="#000">(Attributes)</text>
    <text x="890" y="442" font-size="9" text-anchor="middle" fill="#555">Mid-level</text>
    <text x="890" y="457" font-size="9" text-anchor="middle" fill="#555">features</text>
  </g>
  
  <!-- Arrows from Feature Maps to ID-FC and Attr-FC -->
  <line x1="460" y1="140" x2="840" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="650" y="155" font-size="9" text-anchor="middle" fill="#555">source features</text>
  
  <line x1="460" y1="480" x2="840" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="650" y="445" font-size="9" text-anchor="middle" fill="#555">target features</text>
  
  <!-- Arrows from Clustering to ID-FC -->
  <line x1="570" y1="425" x2="840" y2="210" stroke="#f57f17" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="700" y="300" font-size="9" text-anchor="middle" fill="#f57f17" font-weight="bold">pseudo-labels</text>
  
  <!-- Arrows from Memory Bank to ID-FC and Attr-FC -->
  <line x1="730" y1="425" x2="840" y2="220" stroke="#00695c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="785" y="310" font-size="9" text-anchor="middle" fill="#00695c">OIM</text>
  
  <line x1="780" y1="460" x2="840" y2="440" stroke="#00695c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow between ID-FC and Attr-FC -->
  <line x1="890" y1="240" x2="890" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="905" y="310" font-size="9" text-anchor="start" fill="#555">hierarchical</text>
  
  <!-- L_attr arrow -->
  <line x1="840" y1="320" x2="800" y2="320" stroke="#d32f2f" stroke-width="3" marker-start="url(#arrowhead-loss)"/>
  <line x1="800" y1="320" x2="460" y2="320" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowhead-loss)"/>
  <text x="630" y="310" font-size="13" text-anchor="middle" fill="#d32f2f" font-weight="bold">L_attr (alignment loss)</text>
  
  <!-- Camera-Aware Module -->
  <g id="camera-aware">
    <rect x="1000" y="90" width="140" height="80" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" rx="5"/>
    <text x="1070" y="115" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Camera-Aware</text>
    <text x="1070" y="132" font-size="11" text-anchor="middle" fill="#555">Intra-camera</text>
    <text x="1070" y="147" font-size="11" text-anchor="middle" fill="#555">probability</text>
    <text x="1070" y="162" font-size="11" text-anchor="middle" fill="#555">Inter-camera</text>
  </g>
  
  <!-- Person IDs and Attr IDs -->
  <g id="person-ids">
    <rect x="1000" y="200" width="120" height="50" fill="#fff9c4" stroke="#f57f17" stroke-width="2" rx="5"/>
    <text x="1060" y="230" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Person IDs</text>
  </g>
  
  <g id="attr-ids">
    <rect x="1000" y="270" width="120" height="50" fill="#c5e1a5" stroke="#558b2f" stroke-width="2" rx="5"/>
    <text x="1060" y="300" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Attr IDs</text>
  </g>
  
  <!-- Connections from ID-FC to IDs -->
  <line x1="940" y1="175" x2="1000" y2="210" stroke="#666" stroke-width="1.5"/>
  <line x1="940" y1="185" x2="1000" y2="220" stroke="#666" stroke-width="1.5"/>
  <line x1="940" y1="195" x2="1000" y2="230" stroke="#666" stroke-width="1.5"/>
  <line x1="940" y1="205" x2="1000" y2="240" stroke="#666" stroke-width="1.5"/>
  <line x1="940" y1="215" x2="1000" y2="280" stroke="#666" stroke-width="1.5"/>
  <line x1="940" y1="225" x2="1000" y2="290" stroke="#666" stroke-width="1.5"/>
  <line x1="940" y1="235" x2="1000" y2="310" stroke="#666" stroke-width="1.5"/>
  
  <!-- Camera-aware connections to feature maps -->
  <line x1="1000" y1="130" x2="460" y2="120" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="730" y="110" font-size="9" text-anchor="middle" fill="#0277bd">camera metadata</text>
  
  <line x1="1000" y1="150" x2="460" y2="500" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Attr IDs connection to Attr-FC -->
  <line x1="940" y1="405" x2="1000" y2="285" stroke="#666" stroke-width="1.5"/>
  <line x1="940" y1="415" x2="1000" y2="295" stroke="#666" stroke-width="1.5"/>
  <line x1="940" y1="425" x2="1000" y2="305" stroke="#666" stroke-width="1.5"/>
  
  <!-- Gradient flow arrows (feedback) -->
  <line x1="840" y1="425" x2="620" y2="480" stroke="#1976d2" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead-gradient)"/>
  <text x="730" y="445" font-size="10" text-anchor="middle" fill="#1976d2">gradient flow</text>
  
  <line x1="840" y1="175" x2="620" y2="140" stroke="#1976d2" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead-gradient)"/>
  <text x="730" y="150" font-size="10" text-anchor="middle" fill="#1976d2">gradient flow</text>
  
  <!-- Iterative re-clustering feedback loop -->
  <path d="M 520 425 Q 490 380, 490 320 Q 490 260, 460 180" stroke="#f57f17" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="470" y="300" font-size="10" text-anchor="middle" fill="#f57f17" font-weight="bold">iterative</text>
  <text x="470" y="312" font-size="10" text-anchor="middle" fill="#f57f17" font-weight="bold">update</text>
  
  <!-- Phase indicators -->
  <rect x="1180" y="90" width="180" height="35" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1" rx="3"/>
  <text x="1270" y="113" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Training Phase: Joint Learning</text>
  
  <rect x="1180" y="135" width="180" height="35" fill="#fce4ec" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="1270" y="158" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Alignment: Iterative Updates</text>
  
  <!-- Loss annotations -->
  <g id="loss-annotations">
    <rect x="1180" y="190" width="180" height="40" fill="#ffebee" stroke="#c62828" stroke-width="1" rx="3"/>
    <text x="1270" y="208" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Triplet Loss (Hard-Batch)</text>
    <text x="1270" y="223" font-size="9" text-anchor="middle" fill="#555">L_htri: margin-based</text>
    
    <rect x="1180" y="240" width="180" height="40" fill="#ffebee" stroke="#c62828" stroke-width="1" rx="3"/>
    <text x="1270" y="258" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">OIM Loss</text>
    <text x="1270" y="273" font-size="9" text-anchor="middle" fill="#555">Online Instance Mining</text>
    
    <rect x="1180" y="290" width="180" height="40" fill="#ffebee" stroke="#c62828" stroke-width="1" rx="3"/>
    <text x="1270" y="308" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Attribute Loss (L_attr)</text>
    <text x="1270" y="323" font-size="9" text-anchor="middle" fill="#555">Mid-level alignment</text>
  </g>
  
  <!-- Explanatory annotations at bottom -->
  <text x="50" y="580" font-size="12" fill="#000" font-weight="bold">Pipeline Overview:</text>
  <text x="50" y="600" font-size="11" fill="#555">Source domain: Labeled data trains CNN with known person IDs via supervised triplet loss</text>
  <text x="50" y="620" font-size="11" fill="#555">Target domain: Unlabeled data adapted via iterative clustering to generate pseudo-labels</text>
  <text x="50" y="640" font-size="11" fill="#555">Feature alignment: Statistical matching and cross-domain mixup align source and target distributions</text>
  <text x="50" y="660" font-size="11" fill="#555">Memory Bank: Stores feature prototypes for OIM loss computation and identity matching</text>
  <text x="50" y="680" font-size="11" fill="#555">Temporal consistency: Tracklets from video sequences provide intra-camera and inter-camera constraints</text>
  
  <text x="750" y="600" font-size="11" fill="#555">ID-FC: Identity classifier with triplet and OIM losses for person re-identification</text>
  <text x="750" y="620" font-size="11" fill="#555">Attr-FC: Attribute classifier enforcing mid-level feature alignment (color, texture, shape)</text>
  <text x="750" y="640" font-size="11" fill="#555">Camera-aware: Separates intra-camera (same camera) and inter-camera probability calculations</text>
  <text x="750" y="660" font-size="11" fill="#555">Gradient flow: Backpropagation from losses updates CNN features iteratively for domain alignment</text>
  <text x="750" y="680" font-size="11" fill="#555">L_attr: Attribute alignment loss ensures consistent mid-level representations across domains</text>
</svg>