  <text x="1000" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57c00">Deep Recurrent</text>
  <text x="1000" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57c00">Network (RSHN)</text>
  <text x="1000" y="310" font-size="10" text-anchor="middle" fill="#666">Output: H x W x C</text>
  
  <!-- Green arrows from Video Frames to RSHN (t=0) -->
  <line x1="200" y1="190" x2="200" y2="240" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  
  <!-- Green arrows from Video Frames to RSHN (t=1) -->
  <line x1="500" y1="190" x2="500" y2="240" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  
  <!-- Green arrows from Video Frames to RSHN (t=N) -->
  <line x1="1000" y1="190" x2="1000" y2="240" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  
