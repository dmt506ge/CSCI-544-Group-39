<svg width="1200" height="970" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#28a745" />
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#007bff" />
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff8c00" />
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Holistic Instance Segmentation and Tracking Framework
  </text>
  
  <!-- Time Step Labels -->
  <text x="200" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">t=0</text>
  <text x="500" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">t=1</text>
  <text x="800" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">...</text>
  <text x="1000" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">t=N</text>
  
  <!-- Video Frames - Top Layer (t=0) -->
  <rect x="130" y="90" width="140" height="100" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="200" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#1976d2">Video Frame</text>
  <text x="200" y="150" font-size="12" text-anchor="middle" fill="#1976d2">t=0</text>
  <text x="200" y="170" font-size="10" text-anchor="middle" fill="#666">H x W x 3</text>
  
  <!-- Video Frames - Top Layer (t=1) -->
  <rect x="430" y="90" width="140" height="100" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="500" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#1976d2">Video Frame</text>
  <text x="500" y="150" font-size="12" text-anchor="middle" fill="#1976d2">t=1</text>
  <text x="500" y="170" font-size="10" text-anchor="middle" fill="#666">H x W x 3</text>
  
  <!-- Video Frames - Top Layer (t=N) -->
  <rect x="930" y="90" width="140" height="100" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="1000" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#1976d2">Video Frame</text>
  <text x="1000" y="150" font-size="12" text-anchor="middle" fill="#1976d2">t=N</text>
  <text x="1000" y="170" font-size="10" text-anchor="middle" fill="#666">H x W x 3</text>
  
  <!-- RSHN Modules - Second Layer (t=0) -->
  <rect x="120" y="240" width="160" height="90" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
