  <text x="200" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57c00">Network (RSHN)</text>
  <text x="200" y="310" font-size="10" text-anchor="middle" fill="#666">Output: H x W x C</text>
  
  <!-- RSHN Modules - Second Layer (t=1) -->
  <rect x="420" y="240" width="160" height="90" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="500" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57c00">Deep Recurrent</text>
  <text x="500" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57c00">Network (RSHN)</text>
  <text x="500" y="310" font-size="10" text-anchor="middle" fill="#666">Output: H x W x C</text>
  
  <!-- RSHN Modules - Second Layer (t=N) -->
