  <line x1="500" y1="330" x2="500" y2="380" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <line x1="1000" y1="330" x2="1000" y2="380" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  
  <!-- Faster Mean-shift Clustering - Fourth Layer (t=0) with GPU icon -->
  <rect x="105" y="530" width="190" height="120" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="5" filter="url(#glow)"/>
  <text x="200" y="560" font-size="14" font-weight="bold" text-anchor="middle" fill="#388e3c">Faster Mean-shift</text>
  <text x="200" y="580" font-size="14" font-weight="bold" text-anchor="middle" fill="#388e3c">Clustering</text>
  <rect x="180" y="590" width="40" height="20" fill="#1565c0" stroke="#1565c0" stroke-width="1" rx="2"/>
  <text x="200" y="605" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">GPU</text>
  <text x="200" y="622" font-size="9" text-anchor="middle" fill="#388e3c">Plug-and-play replacement</text>
  <text x="200" y="638" font-size="9" font-weight="bold" text-anchor="middle" fill="#d32f2f">7-10x speedup</text>
  
  <!-- Faster Mean-shift Clustering - Fourth Layer (t=1) with GPU icon -->
  <rect x="405" y="530" width="190" height="120" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="5" filter="url(#glow)"/>
  <text x="500" y="560" font-size="14" font-weight="bold" text-anchor="middle" fill="#388e3c">Faster Mean-shift</text>
  <text x="500" y="580" font-size="14" font-weight="bold" text-anchor="middle" fill="#388e3c">Clustering</text>
  <rect x="480" y="590" width="40" height="20" fill="#1565c0" stroke="#1565c0" stroke-width="1" rx="2"/>
  <text x="500" y="605" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">GPU</text>
  <text x="500" y="622" font-size="9" text-anchor="middle" fill="#388e3c">Plug-and-play replacement</text>
  <text x="500" y="638" font-size="9" font-weight="bold" text-anchor="middle" fill="#d32f2f">7-10x speedup</text>
  
  <!-- Faster Mean-shift Clustering - Fourth Layer (t=N) with GPU icon -->
  <rect x="905" y="530" width="190" height="120" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="5" filter="url(#glow)"/>
  <text x="1000" y="560" font-size="14" font-weight="bold" text-anchor="middle" fill="#388e3c">Faster Mean-shift</text>
  <text x="1000" y="580" font-size="14" font-weight="bold" text-anchor="middle" fill="#388e3c">Clustering</text>
  <rect x="980" y="590" width="40" height="20" fill="#1565c0" stroke="#1565c0" stroke-width="1" rx="2"/>
  <text x="1000" y="605" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">GPU</text>
  <text x="1000" y="622" font-size="9" text-anchor="middle" fill="#388e3c">Plug-and-play replacement</text>
  <text x="1000" y="638" font-size="9" font-weight="bold" text-anchor="middle" fill="#d32f2f">7-10x speedup</text>
  
  <!-- Blue arrows from Pixel-wise Embedding to Faster Mean-shift -->
  <line x1="200" y1="480" x2="200" y2="530" stroke="#007bff" stroke-width="2" marker-end="url(#arrowblue)"/>
  <line x1="500" y1="480" x2="500" y2="530" stroke="#007bff" stroke-width="2" marker-end="url(#arrowblue)"/>
  <line x1="1000" y1="480" x2="1000" y2="530" stroke="#007bff" stroke-width="2" marker-end="url(#arrowblue)"/>
  
  <!-- Output - Bottom Layer (t=0) with enhanced output visualization -->
  <rect x="125" y="700" width="150" height="125" fill="#fce4ec" stroke="#c2185b" stroke-width="2" rx="5"/>
  <text x="200" y="730" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2185b">Segmentation</text>
  <text x="200" y="750" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2185b">and Tracking</text>
  <text x="200" y="770" font-size="12" text-anchor="middle" fill="#c2185b">Output t=0</text>
  <text x="200" y="788" font-size="9" text-anchor="middle" fill="#666">H x W masks</text>
  <text x="200" y="803" font-size="9" text-anchor="middle" fill="#666">Instance masks</text>
  <text x="200" y="817" font-size="9" text-anchor="middle" fill="#666">with tracking IDs</text>
  
  <!-- Output - Bottom Layer (t=1) with enhanced output visualization -->
  <rect x="425" y="700" width="150" height="125" fill="#fce4ec" stroke="#c2185b" stroke-width="2" rx="5"/>
  <text x="500" y="730" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2185b">Segmentation</text>
  <text x="500" y="750" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2185b">and Tracking</text>
  <text x="500" y="770" font-size="12" text-anchor="middle" fill="#c2185b">Output t=1</text>
  <text x="500" y="788" font-size="9" text-anchor="middle" fill="#666">H x W masks</text>
  <text x="500" y="803" font-size="9" text-anchor="middle" fill="#666">Instance masks</text>
  <text x="500" y="817" font-size="9" text-anchor="middle" fill="#666">with tracking IDs</text>
  
  <!-- Output - Bottom Layer (t=N) with enhanced output visualization -->
  <rect x="925" y="700" width="150" height="125" fill="#fce4ec" stroke="#c2185b" stroke-width="2" rx="5"/>
  <text x="1000" y="730" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2185b">Segmentation</text>
  <text x="1000" y="750" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2185b">and Tracking</text>
  <text x="1000" y="770" font-size="12" text-anchor="middle" fill="#c2185b">Output t=N</text>
  <text x="1000" y="788" font-size="9" text-anchor="middle" fill="#666">H x W masks</text>
  <text x="1000" y="803" font-size="9" text-anchor="middle" fill="#666">Instance masks</text>
  <text x="1000" y="817" font-size="9" text-anchor="middle" fill="#666">with tracking IDs</text>
  
  <!-- Blue arrows from Faster Mean-shift to Output -->
  <line x1="200" y1="650" x2="200" y2="700" stroke="#007bff" stroke-width="2" marker-end="url(#arrowblue)"/>
  <line x1="500" y1="650" x2="500" y2="700" stroke="#007bff" stroke-width="2" marker-end="url(#arrowblue)"/>
  <line x1="1000" y1="650" x2="1000" y2="700" stroke="#007bff" stroke-width="2" marker-end="url(#arrowblue)"/>
  
  <!-- Ellipsis indicators - Consistent spacing -->
  <text x="750" y="140" font-size="24" font-weight="bold" text-anchor="middle" fill="#999">...</text>
  <text x="750" y="285" font-size="24" font-weight="bold" text-anchor="middle" fill="#999">...</text>
  <text x="750" y="430" font-size="24" font-weight="bold" text-anchor="middle" fill="#999">...</text>
  <text x="750" y="590" font-size="24" font-weight="bold" text-anchor="middle" fill="#999">...</text>
  <text x="750" y="762" font-size="24" font-weight="bold" text-anchor="middle" fill="#999">...</text>
  
  <!-- Performance annotation - Enhanced prominence -->
  <rect x="500" y="875" width="200" height="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
  <text x="600" y="897" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565c0">
    Real-time processing enabled
  </text>
  
  <!-- Flow legend text at bottom -->
  <text x="600" y="930" font-size="12" text-anchor="middle" fill="#666">
    Vertical flow: data processing pipeline | Horizontal flow: temporal continuity
  </text>
  <text x="600" y="950" font-size="12" text-anchor="middle" fill="#666">
    GPU acceleration enables real-time performance
