<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" 
            markerWidth="6" markerHeight="6" 
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Multi-camera system block -->
  <rect x="50" y="250" width="150" height="100" fill="#cce5ff" stroke="#000" stroke-width="2"/>
  <text x="75" y="300" font-family="Arial" font-size="14">Multi-camera System</text>

  <!-- Images/Videos block -->
  <rect x="250" y="250" width="150" height="100" fill="#d4edda" stroke="#000" stroke-width="2"/>
  <text x="275" y="300" font-family="Arial" font-size="14">Images/Videos</text>

  <!-- ReID Model block -->
  <rect x="450" y="250" width="150" height="100" fill="#ffeeba" stroke="#000" stroke-width="2"/>
  <text x="485" y="300" font-family="Arial" font-size="14">ReID Model</text>

  <!-- Query Image/Video input -->
  <rect x="500" y="100" width="100" height="50" fill="#f8d7da" stroke="#000" stroke-width="2"/>
  <text x="510" y="130" font-family="Arial" font-size="14">Query Image/Video</text>

  <!-- Ranking List block -->
  <rect x="650" y="250" width="150" height="100" fill="#f1f1f1" stroke="#000" stroke-width="2"/>
  <text x="680" y="300" font-family="Arial" font-size="14">Ranking List</text>

  <!-- Arrows for data flow -->
  <line x1="200" y1="300" x2="250" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="300" x2="450" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="300" x2="650" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow for Query Image/Video input -->
  <line x1="550" y1="150" x2="550" y2="250" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
</svg>