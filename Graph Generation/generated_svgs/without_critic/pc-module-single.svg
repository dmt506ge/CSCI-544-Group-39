<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Define arrow markers for directional flow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000" />
    </marker>
  </defs>

  <!-- Top Section: Point cloud adapter -->
  <!-- Left Block: Initial Data Processing -->
  <rect x="50" y="50" width="100" height="100" fill="teal" stroke="#000" stroke-width="2"/>
  <text x="75" y="110" font-size="14" fill="#fff">Initial</text>
  <text x="75" y="130" font-size="14" fill="#fff">Processing</text>

  <!-- Center Block: Transformation Processes -->
  <line x1="150" y1="100" x2="300" y2="100" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="90" font-size="12" fill="#000">Sparsify</text>

  <rect x="300" y="50" width="100" height="100" fill="red" stroke="#000" stroke-width="2"/>
  <text x="325" y="110" font-size="14" fill="#fff">Transformation</text>

  <line x1="400" y1="100" x2="550" y2="100" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="90" font-size="12" fill="#000">Aggregate</text>

  <!-- Right Block: Data Conversion -->
  <circle cx="600" cy="100" r="50" fill="red" stroke="#000" stroke-width="2"/>
  <text x="580" y="110" font-size="14" fill="#fff">Conversion</text>

  <!-- Query Arrow Loop -->
  <line x1="50" y1="150" x2="50" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="50" y1="200" x2="600" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="190" font-size="12" fill="#000">Query</text>

  <!-- Add Arrow Downward -->
  <line x1="600" y1="150" x2="600" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="200" font-size="12" fill="#000">Add</text>

  <!-- Bottom Section: Point Cloud Memory -->
  <!-- Left Block: Initial Transformation -->
  <rect x="50" y="300" width="100" height="100" fill="teal" stroke="#000" stroke-width="2"/>
  <text x="75" y="360" font-size="14" fill="#fff">Voxelize</text>

  <!-- Center Block: Previous Memory -->
  <line x1="150" y1="350" x2="300" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="340" font-size="12" fill="#000">Merge</text>

  <rect x="300" y="300" width="50" height="150" fill="gray" stroke="#000" stroke-width="2"/>
  <text x="310" y="320" font-size="12" fill="#fff">Prev.</text>
  <text x="310" y="340" font-size="12" fill="#fff">Memory</text>

  <!-- Right Block: Updated Memory -->
  <line x1="350" y1="350" x2="500" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="340" font-size="12" fill="#000">Update</text>

  <rect x="500" y="300" width="100" height="100" fill="yellow" stroke="#000" stroke-width="2"/>
  <text x="525" y="360" font-size="14" fill="#fff">Updated</text>
  <text x="525" y="380" font-size="14" fill="#fff">Memory</text>

  <!-- Loop Back to Top Section -->
  <line x1="600" y1="350" x2="600" y2="100" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
</svg>