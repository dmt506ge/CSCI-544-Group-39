<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
      markerWidth="6" markerHeight="6"
      orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Input Module -->
  <rect x="50" y="100" width="100" height="100" fill="#cce5ff" stroke="#003366" stroke-width="2"/>
  <text x="100" y="90" font-size="14" text-anchor="middle" fill="#003366">Input Image</text>
  <line x1="150" y1="150" x2="200" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Encoder Module -->
  <rect x="200" y="50" width="100" height="200" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="250" y="40" font-size="14" text-anchor="middle" fill="#1e8449">Encoder</text>
  <line x1="300" y1="150" x2="350" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decoder Module -->
  <rect x="350" y="50" width="100" height="200" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="40" font-size="14" text-anchor="middle" fill="#c0392b">Decoder</text>
  <line x1="450" y1="150" x2="500" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Target Module -->
  <rect x="500" y="100" width="100" height="100" fill="#f9e79f" stroke="#b7950b" stroke-width="2"/>
  <text x="550" y="90" font-size="14" text-anchor="middle" fill="#b7950b">Target Image</text>
</svg>