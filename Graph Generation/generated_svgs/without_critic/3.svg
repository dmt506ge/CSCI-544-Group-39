<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" 
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>

  <!-- Dashed line separating CPU and GPU sections -->
  <line x1="400" y1="0" x2="400" y2="1000" stroke="black" stroke-dasharray="5,5" />

  <!-- CPU Section (Left Side) -->
  <!-- Top Component -->
  <rect x="100" y="20" width="200" height="40" fill="black" />
  <text x="200" y="45" font-size="14" fill="white" text-anchor="middle">Video Sequences</text>

  <!-- Middle Components -->
  <rect x="100" y="80" width="200" height="40" fill="black" />
  <text x="200" y="105" font-size="14" fill="white" text-anchor="middle">Patch i Pixel-wide Embeddings Si</text>

  <rect x="100" y="140" width="200" height="40" fill="black" />
  <text x="200" y="165" font-size="14" fill="white" text-anchor="middle">Evenly random select N vectors: Sseed ∈ Si</text>

  <!-- Lower Middle Components -->
  <rect x="100" y="200" width="200" height="40" fill="black" />
  <text x="200" y="225" font-size="14" fill="white" text-anchor="middle">Prune &amp; Cluster, get r and I</text>

  <rect x="100" y="260" width="200" height="40" fill="black" />
  <text x="200" y="285" font-size="14" fill="white" text-anchor="middle">Obtain Nmin based on Eq. (19)</text>

  <!-- Decision Points -->
  <rect x="100" y="320" width="200" height="40" fill="none" stroke="black" />
  <text x="200" y="345" font-size="14" fill="black" text-anchor="middle">N ≤ L × Nmin ?</text>

  <rect x="100" y="380" width="200" height="40" fill="none" stroke="black" />
  <text x="200" y="405" font-size="14" fill="black" text-anchor="middle">N ≥ H × Nmin ?</text>

  <rect x="100" y="440" width="200" height="40" fill="none" stroke="black" />
  <text x="200" y="465" font-size="14" fill="black" text-anchor="middle">Patch i is last batch?</text>

  <!-- Left-side Components -->
  <rect x="10" y="320" width="80" height="40" fill="black" />
  <text x="50" y="345" font-size="14" fill="white" text-anchor="middle">Update N</text>

  <rect x="10" y="380" width="80" height="40" fill="black" />
  <text x="50" y="405" font-size="14" fill="white" text-anchor="middle">N = N × 2</text>

  <rect x="10" y="440" width="80" height="40" fill="black" />
  <text x="50" y="465" font-size="14" fill="white" text-anchor="middle">i = i + 1</text>

  <!-- End Component -->
  <rect x="100" y="500" width="80" height="40" fill="black" />
  <text x="140" y="525" font-size="14" fill="white" text-anchor="middle">End</text>

  <!-- GPU Section (Right Side) -->
  <!-- Top Component -->
  <rect x="500" y="80" width="200" height="40" fill="blue" />
  <text x="600" y="105" font-size="14" fill="white" text-anchor="middle">Parallel Mean-shift</text>

  <!-- Middle Component -->
  <rect x="500" y="140" width="200" height="40" fill="none" stroke="blue" />
  <text x="600" y="165" font-size="14" fill="blue" text-anchor="middle">Converged > Y?</text>

  <!-- Arrows for Flow and Connections -->
  <line x1="200" y1="60" x2="200" y2="80" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="120" x2="200" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="180" x2="200" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="240" x2="200" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="300" x2="200" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="200" y1="360" x2="200" y2="380" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="420" x2="200" y2="440" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="480" x2="200" y2="500" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Arrows for Decision Points -->
  <line x1="300" y1="340" x2="400" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="300" y1="400" x2="400" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="300" y1="460" x2="400" y2="460" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="50" y1="340" x2="100" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="50" y1="400" x2="100" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="50" y1="460" x2="100" y2="460" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Arrows for GPU Section -->
  <line x1="600" y1="120" x2="600" y2="140" stroke="blue" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="600" y1="180" x2="600" y2="200" stroke="blue" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Looping Arrows -->
  <line x1="230" y1="340" x2="230" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="230" y1="400" x2="230" y2="360" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="230" y1="460" x2="230" y2="420" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="600" y1="160" x2="600" y2="120" stroke="blue" stroke-width="2" marker-end="url(#arrow)" />
</svg>