<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Top Layer: Video Frames -->
  <rect x="50" y="20" width="100" height="50" fill="#f3f3f3" stroke="#333" />
  <text x="65" y="50" font-family="Arial" font-size="14">Video Frame t=0</text>

  <rect x="250" y="20" width="100" height="50" fill="#f3f3f3" stroke="#333" />
  <text x="265" y="50" font-family="Arial" font-size="14">Video Frame t=1</text>

  <rect x="450" y="20" width="100" height="50" fill="#f3f3f3" stroke="#333" />
  <text x="465" y="50" font-family="Arial" font-size="14">Video Frame t=N</text>

  <!-- Second Layer: Deep Recurrent Network -->
  <rect x="50" y="100" width="100" height="50" fill="#e0f7fa" stroke="#333" />
  <text x="55" y="130" font-family="Arial" font-size="14">RSHN t=0</text>

  <rect x="250" y="100" width="100" height="50" fill="#e0f7fa" stroke="#333" />
  <text x="255" y="130" font-family="Arial" font-size="14">RSHN t=1</text>

  <rect x="450" y="100" width="100" height="50" fill="#e0f7fa" stroke="#333" />
  <text x="455" y="130" font-family="Arial" font-size="14">RSHN t=N</text>

  <!-- Arrows from Video Frames to RSHN modules -->
  <line x1="100" y1="70" x2="100" y2="100" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="300" y1="70" x2="300" y2="100" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="70" x2="500" y2="100" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Third Layer: Pixel-wise Embedding -->
  <rect x="50" y="180" width="100" height="50" fill="#fff3e0" stroke="#333" />
  <text x="55" y="210" font-family="Arial" font-size="14">Embedding t=0</text>

  <rect x="250" y="180" width="100" height="50" fill="#fff3e0" stroke="#333" />
  <text x="255" y="210" font-family="Arial" font-size="14">Embedding t=1</text>

  <rect x="450" y="180" width="100" height="50" fill="#fff3e0" stroke="#333" />
  <text x="455" y="210" font-family="Arial" font-size="14">Embedding t=N</text>

  <!-- Arrows from RSHN modules to Pixel-wise Embedding -->
  <line x1="100" y1="150" x2="100" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="300" y1="150" x2="300" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="150" x2="500" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Fourth Layer: Mean-shift Clustering -->
  <rect x="50" y="260" width="100" height="50" fill="#e8eaf6" stroke="#333" />
  <text x="55" y="290" font-family="Arial" font-size="14">Faster Mean-shift t=0</text>

  <rect x="250" y="260" width="100" height="50" fill="#e8eaf6" stroke="#333" />
  <text x="255" y="290" font-family="Arial" font-size="14">Faster Mean-shift t=1</text>

  <rect x="450" y="260" width="100" height="50" fill="#e8eaf6" stroke="#333" />
  <text x="455" y="290" font-family="Arial" font-size="14">Faster Mean-shift t=N</text>

  <!-- Arrows from Pixel-wise Embedding to Faster Mean-shift Clustering -->
  <line x1="100" y1="230" x2="100" y2="260" stroke="#2196f3" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="300" y1="230" x2="300" y2="260" stroke="#2196f3" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="230" x2="500" y2="260" stroke="#2196f3" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Bottom Layer: Output -->
  <rect x="50" y="340" width="100" height="50" fill="#c8e6c9" stroke="#333" />
  <text x="65" y="370" font-family="Arial" font-size="14">Output t=0</text>

  <rect x="250" y="340" width="100" height="50" fill="#c8e6c9" stroke="#333" />
  <text x="265" y="370" font-family="Arial" font-size="14">Output t=1</text>

  <rect x="450" y="340" width="100" height="50" fill="#c8e6c9" stroke="#333" />
  <text x="465" y="370" font-family="Arial" font-size="14">Output t=N</text>

  <!-- Arrows from Faster Mean-shift Clustering to Output -->
  <line x1="100" y1="310" x2="100" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="300" y1="310" x2="300" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="310" x2="500" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Horizontal arrows between RSHN modules -->
  <line x1="150" y1="125" x2="250" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="350" y1="125" x2="450" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
</svg>