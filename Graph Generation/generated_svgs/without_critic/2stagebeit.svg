<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black" />
    </marker>
  </defs>
  
  <!-- Stage 1 -->
  <rect x="50" y="50" width="150" height="50" fill="#FFD700" stroke="black" />
  <text x="75" y="80" font-size="14px" fill="black">Original Image</text>
  
  <line x1="200" y1="75" x2="300" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="300" y="50" width="150" height="50" fill="#ADFF2F" stroke="black" />
  <text x="325" y="80" font-size="14px" fill="black">Tokenizer</text>
  
  <line x1="450" y1="75" x2="550" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="550" y="50" width="150" height="50" fill="#87CEEB" stroke="black" />
  <text x="575" y="80" font-size="14px" fill="black">Numerical Tokens</text>
  
  <line x1="700" y1="75" x2="800" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="800" y="50" width="150" height="50" fill="#ADFF2F" stroke="black" />
  <text x="825" y="80" font-size="14px" fill="black">Decoder</text>
  
  <line x1="950" y1="75" x2="1050" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="1050" y="50" width="150" height="50" fill="#FFD700" stroke="black" />
  <text x="1075" y="80" font-size="14px" fill="black">Reconstructed Image</text>
  
  <!-- Stage 2 -->
  <rect x="50" y="200" width="150" height="50" fill="#FFD700" stroke="black" />
  <text x="75" y="230" font-size="14px" fill="black">Image Input</text>
  
  <line x1="200" y1="225" x2="300" y2="225" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="300" y="200" width="150" height="50" fill="#ADFF2F" stroke="black" />
  <text x="325" y="230" font-size="14px" fill="black">Tokenizer <tspan font-size="12px">(lock icon)</tspan></text>
  
  <line x1="375" y1="250" x2="375" y2="325" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="225" y="325" width="300" height="50" fill="#FFB6C1" stroke="black" />
  <text x="275" y="355" font-size="14px" fill="black">Masked Image Modeling Head</text>
  
  <line x1="375" y1="375" x2="375" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="175" y="450" width="400" height="50" fill="#9370DB" stroke="black" />
  <text x="275" y="480" font-size="14px" fill="white">BEiT Encoder</text>
  
  <line x1="175" y1="500" x2="175" y2="550" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="575" y1="500" x2="575" y2="550" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="50" y="550" width="100" height="50" fill="#AFEEEE" stroke="black" />
  <text x="60" y="580" font-size="12px" fill="black">Patch Embedding</text>
  
  <line x1="150" y1="575" x2="200" y2="575" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="200" y="550" width="100" height="50" fill="#AFEEEE" stroke="black" />
  <text x="210" y="580" font-size="12px" fill="black">Position Embedding</text>
  
  <rect x="50" y="625" width="150" height="150" fill="#D3D3D3" stroke="black" />
  <text x="100" y="700" font-size="14px" fill="black">Image Patches</text>
</svg>